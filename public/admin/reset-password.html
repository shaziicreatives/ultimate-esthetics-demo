<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset admin password · Ultimate Esthetics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>:root{color-scheme:light;--bg:#FBF9F5;--surface:#fff;--ink:#2C2621;--muted:#6B5E53;--line:#E8DFD1;--accent:#4A3F35}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px 'Hanken Grotesk',sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);padding:30px;background:var(--surface);border:1px solid var(--line);border-radius:22px}h1{font:36px 'Instrument Serif',serif;margin:0 0 8px}p{color:var(--muted)}label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}button{margin-top:18px;padding:12px 16px;width:100%;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 14px 'Hanken Grotesk';cursor:pointer}.msg{margin-top:12px;font-size:13px}</style></head>
<body><main class="card"><h1>Set a new password</h1><p>Use a strong password with at least 10 characters and one number. This link can only be used once.</p>
<form id="f"><label for="p">New password</label><input id="p" type="password" minlength="10" autocomplete="new-password" required><label for="p2">Confirm password</label><input id="p2" type="password" minlength="10" autocomplete="new-password" required><button type="submit">Reset password</button><div class="msg" id="m" role="status"></div></form></main>
<script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('m'),p=document.getElementById('p').value,p2=document.getElementById('p2').value;if(p!==p2){m.textContent='Passwords do not match.';return}m.textContent='Saving…';try{const r=await fetch('/api/admin/password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'consume',token:new URLSearchParams(location.search).get('token'),new_password:p})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not reset password');m.textContent='Password updated. You can now sign in to the admin panel.';e.target.reset()}catch(x){m.textContent=x.message}});</script></body></html>
