<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Initial Admin Setup · Ultimate Esthetics</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAF6EE;color:#2F2619;font:15px system-ui}.card{width:min(420px,calc(100% - 40px));box-sizing:border-box;background:white;border:1px solid #E0D4BC;border-radius:20px;padding:28px}h1{font:30px Georgia;margin:0 0 8px}p{color:#7A6A50;font-size:13px}label{display:block;font-size:13px;margin:14px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #D8C6A2;border-radius:9px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#3E3325;color:white;font-weight:700}#msg{margin-top:14px;white-space:pre-wrap}</style></head><body><main class="card"><h1>Set up clinic owner</h1><p>Create the first production admin account. Use a unique password of at least 12 characters.</p><form id="f"><label>Setup key</label><input name="setup_key" type="password" required autocomplete="off"><label>Username</label><input name="username" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]+"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required minlength="12" autocomplete="new-password"><label>Confirm password</label><input name="confirm" type="password" required minlength="12" autocomplete="new-password"><button>Create owner account</button></form><div id="msg" role="status"></div></main><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,d=Object.fromEntries(new FormData(f));const msg=document.getElementById('msg');if(d.password!==d.confirm){msg.textContent='Passwords do not match.';return}delete d.confirm;msg.textContent='Creating account…';try{const r=await fetch('/api/admin/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();msg.textContent=r.ok?'Owner account created. Go to /admin and sign in.':(j.error||'Setup failed.');if(r.ok)f.reset()}catch{msg.textContent='Network error. Please retry.'}});</script></body></html>
