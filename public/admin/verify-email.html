<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify email · Ultimate Esthetics</title>
<style>:root{color-scheme:light;--bg:#FBF9F5;--surface:#fff;--ink:#2C2621;--muted:#6B5E53;--line:#E8DFD1;--accent:#4A3F35}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);padding:30px;background:var(--surface);border:1px solid var(--line);border-radius:22px}h1{font-size:28px;margin:0 0 12px}p{color:var(--muted);line-height:1.6}a{color:var(--accent)}</style></head>
<body><main class="card"><h1>Verify your new email</h1><p id="msg">Checking your secure verification link…</p><p><a href="/admin/">Return to admin login</a></p></main>
<script>(async()=>{const el=document.getElementById('msg'),token=new URLSearchParams(location.search).get('token');if(!token){el.textContent='This verification link is invalid.';return;}try{const r=await fetch('/api/admin/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'consume_email_change',token})});const d=await r.json();if(!r.ok)throw Error(d.error||'Email verification failed.');el.textContent=d.message||'Your email has been updated. You can now use the new email for account recovery.';}catch(e){el.textContent=e.message;}})();</script></body></html>
