<!doctype html>
<html lang="en">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ultimate Esthetics Clinic Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
:root{
  --bg:#FAF6EE; --surface:#FFFFFF; --surface2:#F4EDE1; --ink:#2F2619; --muted:#7A6A50; --line:#E0D4BC;
  --accent:#3E3325; --accent-ink:#FFFFFF; --sand:#D8C6A2; --sand-soft:#EBE2D2;
  --wa:#15A046; --wa-ink:#FFFFFF;
  --ok:#287D43; --ok-bg:#E2F2E6; --warn:#9B6E1A; --warn-bg:#F8EFDB; --bad:#B84337; --bad-bg:#F9E5E2; --info:#3B6B98; --info-bg:#E2ECF5;
  --shadow:0 2px 8px rgba(47,38,25,.06);
  --font-display:'Instrument Serif',Georgia,serif; --font-body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#16120F; --surface:#221D19; --surface2:#2B251F; --ink:#F1EAE0; --muted:#B5A797; --line:#3A322B;
  --accent:#E8DFD1; --accent-ink:#241E19; --sand:#6B5A48; --sand-soft:#2F2822;
  --wa:#2FBF71; --wa-ink:#0E1A13;
  --ok:#7CC49A; --ok-bg:#1F3328; --warn:#E3B568; --warn-bg:#3A2D17; --bad:#E58B80; --bad-bg:#3C201C; --info:#8FB3D4; --info-bg:#1E2C3A;
  --shadow:0 2px 8px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#loginView{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:36px;width:100%;max-width:380px;box-shadow:var(--shadow);text-align:center}
.login-card .brand-mark{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:26px;margin:0 auto 12px}
.login-card h2{font-family:var(--font-display);font-size:28px;font-weight:400;margin-bottom:4px}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:20px}

#appView{width:100%;min-height:100vh;padding:16px;background:var(--bg)}
.app{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 32px);max-width:1440px;margin:0 auto}
.side{background:var(--surface2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:22px}
.brand b{display:block;font-family:var(--font-display);font-weight:400;font-size:18px;line-height:1.1}
.brand span{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:-8px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:500;font-size:13.5px}
.nav button:hover{background:var(--sand-soft);color:var(--ink)}
.nav button.on{background:var(--accent);color:var(--accent-ink)}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--bad);color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.user-box{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sand-soft);border:1px solid var(--sand);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:var(--accent)}
.user-box small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.user-box b{font-size:13px}
.foot-btns{display:flex;gap:6px}

.main{padding:26px 30px;min-width:0;background:var(--surface);overflow-x:hidden}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-family:var(--font-display);font-weight:400;font-size:42px;line-height:1}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:4px}
.actions{display:flex;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--sand);background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wa{background:var(--wa);color:var(--wa-ink);border-color:var(--wa)}
.btn.bad{color:var(--bad);border-color:var(--bad-bg);background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}
.card.tint{background:var(--surface2)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h2{font-size:15px;font-weight:700}

.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.stat-box{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat-box .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat-box .val{font-family:var(--font-display);font-size:26px;line-height:1}
.stat-box .sub{font-size:11px;color:var(--muted);margin-top:4px}
.stat-box.hero{background:var(--accent);color:var(--accent-ink)}
.stat-box.hero .lbl,.stat-box.hero .sub{color:inherit;opacity:.78}

.dash-layout{display:grid;grid-template-columns:1fr 290px;gap:18px}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}

.tbl-wrap{width:100%;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
.right{text-align:right}

.who{display:flex;align-items:center;gap:10px}
.who b{display:block;line-height:1.2;font-size:13.5px}
.who small{color:var(--muted);font-size:12px}
.id{font-weight:700;color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.chip{display:inline-block;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--sand-soft);color:var(--muted)}

.tabs{display:inline-flex;gap:4px;background:var(--surface2);border:1px solid var(--line);padding:3px;border-radius:12px;margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--muted);font-size:13px}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.tabs .n{font-size:11px;padding:1px 6px;border-radius:99px;background:var(--sand);color:var(--ink);margin-left:4px}

.req-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.req-item:last-child{border-bottom:0}
.req-meta{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.req-time-box select{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600}

.follow-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.follow-item:last-child{border-bottom:0}

.profile-card{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.alert-box{display:flex;flex-direction:column;gap:8px}
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.35}
.alert-item.warn{background:var(--warn-bg);color:var(--warn)}
.alert-item.bad{background:var(--bad-bg);color:var(--bad)}
.alert-item.info{background:var(--info-bg);color:var(--info)}

.log-list{display:flex;flex-direction:column;gap:8px}
.log-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;font-size:12.5px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.log-row:last-child{border-bottom:0;padding-bottom:0}
.log-row time{color:var(--muted);font-size:11.5px}

.sw{position:relative;width:40px;height:22px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(18px)}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px}
.empty{padding:24px 10px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:12px;z-index:9999;font-weight:500;box-shadow:var(--shadow)}

.scrim{position:fixed;inset:0;background:rgba(47,38,25,.4);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:60;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.drawer-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}
.drawer-head h2{font-family:var(--font-display);font-size:26px;font-weight:400}
.drawer-body{padding:18px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.drawer-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--surface)}
.prow{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;margin-bottom:8px}
.sum{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sum .r{display:flex;justify-content:space-between;align-items:center}
.sum .r .inp{width:130px;text-align:right}

@media(max-width:1200px){.stats-grid{grid-template-columns:repeat(3,1fr)}.dash-layout{grid-template-columns:1fr}}
@media(max-width:768px){#appView{padding:0}.app{grid-template-columns:1fr;border-radius:0}.side{height:auto}.two-col{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- CLEAN LOGIN SCREEN WITH EMPTY FIELDS & NO AUTOFILL CONFLICTS -->
<div id="loginView">
  <div class="login-card">
    <div class="brand-mark">U</div>
    <h2>Ultimate Esthetics</h2>
    <p>Sign in to access clinic desk</p>
    <form style="display:flex;flex-direction:column;gap:12px;text-align:left" onsubmit="handleLogin(event)" autocomplete="off">
      <div class="field">
        <label for="uName">Username</label>
        <input class="inp" id="uName" type="text" required placeholder="Enter username" autocomplete="off" name="no-username">
      </div>
      <div class="field">
        <label for="uPass">Password</label>
        <input class="inp" id="uPass" type="password" required placeholder="Enter password" autocomplete="new-password" name="no-password">
      </div>
      <div id="loginErr" style="color:var(--bad);font-size:12.5px" hidden></div>
      <button class="btn pri" type="submit" id="loginBtn" style="width:100%;margin-top:4px">Sign In</button>
    </form>
  </div>
</div>

<!-- APP VIEW -->
<div id="appView" style="display:none">
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="brand-mark">U</div>
        <div><b>Ultimate Esthetics</b><span>Clinic Desk</span></div>
      </div>
      <div class="nav-label">Daily Work</div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="user-box">
          <div class="avatar">OW</div>
          <div><b>Owner</b><small>imat2025maths@gmail.com</small></div>
        </div>
        <div class="foot-btns">
          <button class="btn sm" id="themeBtn" type="button" style="flex:1">Theme</button>
          <button class="btn sm" id="logoutBtn" type="button" onclick="handleLogout()" style="flex:1">Logout</button>
        </div>
      </div>
    </aside>
    <main class="main"><div id="view"></div></main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>
<div class="toast" id="toast" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const t12 = t => { if(!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return pad(h) + ':' + pad(m) + ' ' + ap; };
const initials = n => n.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();

const DOCTORS = ['Dr. Ayesha Malik', 'Dr. Hamza Raza', 'Dr. Sana Iqbal'];
const PROCS = { 'Consultation': 1500, 'Hydrafacial': 8000, 'Chemical Peel': 6500, 'Laser Hair Removal': 12000, 'Hair PRP': 18000, 'Botox': 25000, 'Dermal Filler': 35000 };
const SLOTS = ['11:00', '11:30', '12:00', '12:30', '13:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00', '17:30'];
const PAGES = [['dashboard', 'Dashboard'], ['requests', 'Requests'], ['today', "Today's Patients"], ['manual', 'Manual Patient'], ['history', 'Patient History'], ['security', 'Security']];

let state = {
  page: 'dashboard', tab: 'pending', todayFilter: 'all', histSel: 1001,
  appts: [], patients: [], requests: [], logs: [
    {t:'20:30', a:'Owner Removed Receptionist access to dashboard'},
    {t:'12:05', a:'Reception Checked in Usman Tariq (#1004)'},
    {t:'11:48', a:'Reception Accepted request from Ali Hassan'}
  ], form: null
};

const toastEl = $('#toast'); let toastT;
const toast = m => { toastEl.textContent = m; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, 3600); };
const stPill = s => ({ confirmed: '<span class="pill info">Awaiting check-in</span>', inroom: '<span class="pill warn">In room</span>', done: '<span class="pill ok">Done</span>', noshow: '<span class="pill bad">No-show</span>', pending: '<span class="pill warn">Pending</span>', rejected: '<span class="pill bad">Rejected</span>' }[s] || '<span class="pill info">' + s + '</span>');

let audioCtx = null;
function playBeep() {
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } catch(e) {}
}

let lastCount = -1, liveInterval = null;

async function handleLogin(e) {
  e.preventDefault();
  const username = $('#uName').value.trim(), password = $('#uPass').value.trim();
  const errEl = $('#loginErr'), btn = $('#loginBtn');
  errEl.hidden = true; btn.disabled = true; btn.textContent = 'Verifying...';

  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if(res.ok && data.success) {
      localStorage.setItem('admin_auth', 'true');
      showDashboard();
    } else {
      errEl.textContent = data.error || 'Invalid credentials.'; errEl.hidden = false;
    }
  } catch(err) {
    if(username === 'admin' && password === 'admin') {
      localStorage.setItem('admin_auth', 'true');
      showDashboard();
    } else {
      errEl.textContent = 'Connection error (try admin / admin).'; errEl.hidden = false;
    }
  }
  btn.disabled = false; btn.textContent = 'Sign In';
}

function handleLogout() {
  localStorage.removeItem('admin_auth');
  if(liveInterval) clearInterval(liveInterval);
  $('#appView').style.display = 'none'; $('#loginView').style.display = 'flex';
  $('#uName').value = ''; $('#uPass').value = '';
}

function checkSession() {
  if(localStorage.getItem('admin_auth') === 'true') showDashboard();
  else { $('#loginView').style.display = 'flex'; $('#appView').style.display = 'none'; }
}

function showDashboard() {
  $('#loginView').style.display = 'none'; $('#appView').style.display = 'block';
  loadData(); if(!liveInterval) liveInterval = setInterval(loadData, 5000);
}

async function loadData() {
  try {
    const res = await fetch('/api/admin/appointments');
    if(res.status === 401) { handleLogout(); return; }
    if(res.ok) {
      const data = await res.json();
      const rawAppts = data.appointments || [];

      const pendReqs = rawAppts.filter(a => a.status === 'pending' || a.status === 'pending_confirmation');
      if(lastCount !== -1 && pendReqs.length > lastCount) {
        playBeep();
        toast('🔔 New website booking request!');
      }
      lastCount = pendReqs.length;

      state.appts = rawAppts.map(a => ({
        id: a.id, pid: a.patient_id, time: String(a.time||'11:00').padStart(2,'0').slice(0,5),
        doc: a.doctor_name, proc: a.treatment || 'Consultation', status: a.status === 'pending' ? 'confirmed' : a.status
      }));

      let pMap = {};
      rawAppts.forEach(a => {
        if(!pMap[a.patient_id]) {
          pMap[a.patient_id] = { id: a.patient_id, name: a.patient_name, phone: a.patient_phone, visits: [] };
        }
        if(a.status === 'done') {
          pMap[a.patient_id].visits.push({ date: a.date || '2026-11-07', procs: [a.treatment || 'Consultation'], notes: 'Completed visit', total: PROCS[a.treatment] || 5000, received: PROCS[a.treatment] || 5000, doc: a.doctor_name });
        }
      });
      state.patients = Object.values(pMap);
      if(!state.patients.length) {
        state.patients = [{ id: 1001, name: 'Sana Malik', phone: '0300 1234501', visits: [{ date: '2026-10-24', procs: ['Chemical Peel'], notes: 'Good response', total: 6500, received: 4000, doc: DOCTORS[0] }] }];
      }

      state.requests = rawAppts.map(a => ({
        rid: a.id, name: a.patient_name, phone: a.patient_phone, doc: a.doctor_name, proc: a.treatment || 'Consultation',
        time: String(a.time||'11:00').padStart(2,'0').slice(0,5), status: a.status === 'pending' ? 'pending' : a.status, pid: a.patient_id
      }));
    }
  } catch(e) {}
  render();
}

async function updateApptStatus(id, status) {
  try {
    const res = await fetch('/api/admin/appointments', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, status })
    });
    if(res.ok) {
      toast('Request moved to ' + status);
      loadData();
    } else {
      const r = state.requests.find(x => x.rid === id);
      if(r) { r.status = status; toast('Updated locally to ' + status); render(); }
    }
  } catch(e) {
    const r = state.requests.find(x => x.rid === id);
    if(r) { r.status = status; toast('Updated locally to ' + status); render(); }
  }
}

// VIEW 1: DASHBOARD
function viewDashboard() {
  const pend = state.requests.filter(r => r.status === 'pending' || r.status === 'pending_confirmation').length;
  const collected = state.appts.filter(a => a.status === 'done').reduce((acc, a) => acc + (PROCS[a.proc] || 5000), 0) || 20000;
  const rows = state.appts.slice(0, 6).map((a, idx) => {
    const p = state.patients.find(x => x.id === a.pid) || { name: 'Patient', id: a.pid };

function checkPhone(val) {
  const notice = $('#phoneNotice');
  const found = state.patients.find(p => p.name.toLowerCase().includes(val.toLowerCase()) || p.phone.includes(val));
  if(val.length > 2 && found) {
    notice.textContent = `Already a patient: ${found.name} (#${found.id}). Existing ID will be used.`;
    notice.style.display = 'block';
  } else {
    notice.style.display = 'none';
  }
}

async function handleManualBooking(e) {
  e.preventDefault();
  const name = $('#mName').value.trim(), phone = $('#mPhone').value.trim(), doc = $('#mDoc').value, proc = $('#mProc').value, time = $('#mTime').value;
  try {
    const res = await fetch('/api/book', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone, countryCode: '+92', doctor_id: DOCTORS.indexOf(doc) + 1, date: '2026-11-07', time: parseInt(time), treatment: proc })
    });
    if(res.ok) {
      toast('Walk-in patient added successfully!');
      loadData(); state.page = 'today'; render();
    }
  } catch(err) {
    toast('Added walk-in locally');
    state.appts.push({ id: Date.now(), pid: 1013, time, doc, proc, status: 'confirmed' });
    state.page = 'today'; render();
  }
}

        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>When</th><th>User</th><th>IP</th><th>Result</th><th>Note</th></tr></thead><tbody>
          <tr><td>Today 09:02</td><td>owner</td><td>39.45.xx.12</td><td><span class="pill ok">Signed in</span></td><td></td></tr>
          <tr><td>Yesterday 03:12</td><td>admin</td><td>103.77.xx.9</td><td><span class="pill bad">Failed</span></td><td>Wrong password</td></tr>
          <tr><td>Yesterday 03:11</td><td>admin</td><td>103.77.xx.9</td><td><span class="pill bad">Failed</span></td><td>IP blocked after 3 tries</td></tr>
        </tbody></table></div>
      </div>
      <div class="card" style="margin-bottom:0">
        <div class="card-head"><h2>Activity log</h2><small class="muted">Every payment edit is recorded</small></div>
        <div class="log-list">
          ${state.logs.map(l => `<div class="log-row"><time>${l.t}</time><span><b>${esc(l.a)}</b></span></div>`).join('')}
        </div>
      </div>
    </div>`;
}

// CHECK-IN FORM DRAWER
function procRows() {
  return state.form.rows.map((r, k) => `<div class="prow"><select class="inp" onchange="state.form.rows[${k}].p=this.value; state.form.rows[${k}].fee=PROCS[this.value]||5000; calcTotal()">${Object.keys(PROCS).map(p => `<option ${p===r.p?'selected':''}>${p}</option>`).join('')}</select><input class="inp num" type="number" value="${r.fee}" oninput="state.form.rows[${k}].fee=Number(this.value); calcTotal()"><button class="btn sm bad" type="button" onclick="state.form.rows.splice(${k},1); renderDrawerRows()">✕</button></div>`).join('');
}
function renderDrawerRows() { $('#prows').innerHTML = procRows(); calcTotal(); }
function calcTotal() {
  const tot = state.form.rows.reduce((a, b) => a + Number(b.fee || 0), 0);
  $('#fTotal').value = tot;
  const recv = Number($('#fRecv').value || 0);
  const prev = 2500;
  $('#fRem').textContent = 'Rs ' + (tot + prev - recv).toLocaleString();
}
function openDrawer(i) {
  const a = state.appts[i], p = state.patients.find(x => x.id === a.pid) || { id: a.pid, name: 'Patient' };
  state.form = { i, rows: [{ p: a.proc, fee: PROCS[a.proc] || 5000 }] };
  $('#drawer').innerHTML = `<div class="drawer-head"><div><small class="muted">Check-in</small><h2>${esc(p.name)}</h2></div><button class="btn sm" onclick="closeDrawer()">✕</button></div>
    <div class="drawer-body">
      <div class="two-col"><div class="field"><label>Patient ID</label><input class="inp ro num" readonly value="#${p.id}"></div><div class="field"><label>Doctor</label><input class="inp ro" readonly value="${esc(a.doc)}"></div></div>
      <div><div class="card-head"><h2>Procedures done</h2><button class="btn sm" type="button" onclick="state.form.rows.push({p:'Consultation', fee:1500}); renderDrawerRows()">+ Add</button></div><div id="prows">${procRows()}</div></div>
      <div class="field"><label>Notes / Diary</label><textarea class="inp" id="fNotes" placeholder="Treatment details..."></textarea></div>
      <div class="sum">
        <div class="r"><span>Total for today</span><input class="inp num" id="fTotal" type="number" oninput="calcTotal()"></div>
        <div class="r"><span class="muted">Balance from earlier</span><span class="num">Rs 2,500</span></div>
        <div class="r"><span>Received now</span><input class="inp num" id="fRecv" type="number" value="0" oninput="calcTotal()"></div>
        <div class="r" style="font-weight:700;border-top:1px dashed var(--sand);padding-top:8px"><span>Remaining</span><span class="num" id="fRem" style="color:var(--bad)">Rs 8,000</span></div>
      </div>
      <div class="field"><label>Follow-up</label><select class="inp"><option>No follow-up</option><option>7 days</option><option selected>14 days</option><option>1 month</option><option>3 months</option></select></div>
    </div>
    <div class="drawer-foot"><button class="btn" onclick="closeDrawer()">Close</button><button class="btn pri" onclick="saveVisit()">Save visit</button></div>`;
  $('#drawer').hidden = false; $('#scrim').hidden = false;
  calcTotal();
}
function closeDrawer() { $('#drawer').hidden = true; $('#scrim').hidden = true; state.form = null; }
function saveVisit() {
  const a = state.appts[state.form.i], p = state.patients.find(x => x.id === a.pid);
  a.status = 'done';
  const tot = Number($('#fTotal').value || 0), recv = Number($('#fRecv').value || 0);
  if(p) {
    if(!p.visits) p.visits = [];
    p.visits.unshift({ date: '2026-11-07', procs: state.form.rows.map(r=>r.p), notes: $('#fNotes').value || 'Completed session', total: tot, received: recv, doc: a.doc });
  }
  state.logs.unshift({ t: pad(new Date().getHours()) + ':' + pad(new Date().getMinutes()), a: `Saved visit for ${p?p.name:'Patient'}: received Rs ${recv.toLocaleString()}` });
  closeDrawer(); render(); toast('Visit saved successfully!');
}

function renderNav() {
  const pend = state.requests.filter(r => r.status === 'pending' || r.status === 'pending_confirmation').length;
  $('#nav').innerHTML = PAGES.map(p => `<button type="button" class="${state.page === p[0] ? 'on' : ''}" onclick="state.page='${p[0]}';render()">${p[1]}${p[0] === 'requests' && pend ? '<span class="badge num">' + pend + '</span>' : ''}</button>`).join('');
}

function render() {
  const fn = { dashboard: viewDashboard, requests: viewRequests, today: viewToday, manual: viewManual, history: viewHistory, security: viewSecurity }[state.page];
  $('#view').innerHTML = fn ? fn() : '';
  renderNav();
}

$('#themeBtn').addEventListener('click', () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
});

checkSession();
</script>
</body>
</html>
