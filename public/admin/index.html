<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/admin/manifest.webmanifest">
<meta name="theme-color" content="#3E3325">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ultimate Clinic">
<link rel="icon" href="/admin/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/admin/icon.svg">
<title>Ultimate Esthetics Clinic Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
:root{
  --bg:#FAF6EE; --surface:#FFFFFF; --surface2:#F4EDE1; --ink:#2F2619; --muted:#7A6A50; --line:#E0D4BC;
  --accent:#3E3325; --accent-ink:#FFFFFF; --sand:#D8C6A2; --sand-soft:#EBE2D2;
  --wa:#15A046; --wa-ink:#FFFFFF;
  --ok:#287D43; --ok-bg:#E2F2E6; --warn:#9B6E1A; --warn-bg:#F8EFDB; --bad:#B84337; --bad-bg:#F9E5E2; --info:#3B6B98; --info-bg:#E2ECF5;
  --shadow:0 2px 8px rgba(47,38,25,.06);
  --font-display:'Instrument Serif',Georgia,serif; --font-body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#16120F; --surface:#221D19; --surface2:#2B251F; --ink:#F1EAE0; --muted:#B5A797; --line:#3A322B;
  --accent:#E8DFD1; --accent-ink:#241E19; --sand:#6B5A48; --sand-soft:#2F2822;
  --wa:#2FBF71; --wa-ink:#0E1A13;
  --ok:#7CC49A; --ok-bg:#1F3328; --warn:#E3B568; --warn-bg:#3A2D17; --bad:#E58B80; --bad-bg:#3C201C; --info:#8FB3D4; --info-bg:#1E2C3A;
  --shadow:0 2px 8px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
@keyframes clinicMarkIn{0%{opacity:0;transform:translateY(7px) scale(.94)}70%{opacity:1;transform:translateY(-1px) scale(1.015)}100%{opacity:1;transform:translateY(0) scale(1)}}
.brand-mark{animation:clinicMarkIn .65s cubic-bezier(.2,.75,.25,1) both}
#appView{animation:clinicViewIn .35s ease-out both}
@keyframes clinicViewIn{from{opacity:.82;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

html{background:var(--bg)}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}

/* login */
#loginView{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:36px;width:100%;max-width:380px;box-shadow:var(--shadow);text-align:center}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:22px;flex:none}
.login-card .brand-mark{width:46px;height:46px;font-size:26px;margin:0 auto 12px}
.login-card h2{font-family:var(--font-display);font-size:28px;font-weight:400;margin-bottom:4px}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:20px}

/* shell: minmax(0,1fr) is the fix for text getting cut / half-white */
#appView{display:none;padding:16px}
.app{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 32px);max-width:1440px;margin:0 auto}
.side{background:var(--surface2);border-right:1px solid var(--line);border-radius:24px 0 0 24px;padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{display:block;font-family:var(--font-display);font-weight:400;font-size:18px;line-height:1.1}
.brand span{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:-8px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:500;font-size:13.5px}
.nav button:hover{background:var(--sand-soft);color:var(--ink)}
.nav button.on{background:var(--accent);color:var(--accent-ink)}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--bad);color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.user-box{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.user-box>div:last-child{min-width:0}
.user-box b{font-size:13px;display:block}
.user-box small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sand-soft);border:1px solid var(--sand);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:var(--accent)}
.install-app-btn{width:100%;justify-content:center;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.foot-btns{display:flex;gap:6px;width:100%}.foot-btns .btn{min-width:0;flex:1 1 0;padding-left:4px;padding-right:4px;font-size:11px}

.main{padding:26px 30px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-family:var(--font-display);font-weight:400;font-size:40px;line-height:1.05}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--sand);background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wa{background:var(--wa);color:var(--wa-ink);border-color:var(--wa)}
.btn.bad{color:var(--bad);border-color:var(--bad-bg);background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card.tint{background:var(--surface2)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{font-size:15px;font-weight:700}
.muted{color:var(--muted)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat-box{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.stat-box .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat-box .val{font-family:var(--font-display);font-size:30px;line-height:1}
.stat-box .sub{font-size:11.5px;color:var(--muted);margin-top:5px}
.stat-box.hero{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stat-box.hero .lbl,.stat-box.hero .sub{color:inherit;opacity:.78}

.dash-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}

.tbl-wrap{width:100%;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:520px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.right{text-align:right}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who>div:last-child{min-width:0}
.who b{display:block;line-height:1.2;font-size:13.5px}
.who small{color:var(--muted);font-size:12px;display:block}
.id{font-weight:700;color:var(--accent)}
:root[data-theme="dark"] .id{color:var(--sand)}

.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:var(--sand-soft);color:var(--muted)}
.chip{display:inline-block;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--sand-soft);color:var(--muted)}

.tabs{display:inline-flex;gap:4px;background:var(--surface2);border:1px solid var(--line);padding:3px;border-radius:12px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--muted);font-size:13px}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.tabs .n{font-size:11px;padding:1px 6px;border-radius:99px;background:var(--sand);color:var(--ink);margin-left:4px}

.req-item{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;align-items:center;gap:16px;padding:14px;border:1px solid var(--line);border-radius:16px;margin:10px 0;background:linear-gradient(115deg,rgba(66,133,244,.09),rgba(234,67,53,.055) 38%,rgba(251,188,5,.07) 68%,rgba(52,168,83,.07));box-shadow:0 3px 14px rgba(60,70,90,.045)}
.req-item:last-child{border-bottom:1px solid var(--line)}
.req-meta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>div:first-child{min-width:0}
.row small{display:block;color:var(--muted);font-size:12px}
.alert-box{display:flex;flex-direction:column;gap:8px}
.alert-item{padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.4}
.alert-item.warn{background:var(--warn-bg);color:var(--warn)}
.alert-item.bad{background:var(--bad-bg);color:var(--bad)}
.alert-item.info{background:var(--info-bg);color:var(--info)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0}
.hint{font-size:12px;color:var(--muted)}
.hint.ok{color:var(--ok)}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.bigid{font-family:var(--font-display);font-size:64px;line-height:1;color:var(--accent)}
:root[data-theme="dark"] .bigid{color:var(--sand)}

.hist{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.plist{display:flex;flex-direction:column;gap:2px;max-height:560px;overflow-y:auto}
.pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:10px;border-radius:12px}
.pitem:hover{background:var(--surface2)}
.pitem.on{background:var(--surface2);border-color:var(--sand)}
.pitem>div:nth-child(2){flex:1;min-width:0}
.pitem small{color:var(--muted);font-size:12px;display:block}
.tl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .d{font-weight:700;font-size:13px}
.tl .d small{display:block;color:var(--muted);font-weight:500}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--accent);color:var(--accent-ink);padding:11px 18px;border-radius:12px;z-index:9999;font-weight:500;box-shadow:var(--shadow);max-width:min(560px,calc(100% - 32px))}
.err{color:var(--bad);font-size:12.5px}
.visit-modal{position:fixed;inset:0;background:#0008;z-index:10000;display:grid;place-items:center;padding:16px}
.visit-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.proc-line{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:8px;margin:8px 0}
.invoice-brand{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.invoice-brand h2{font:30px var(--font-display);color:var(--ink)}
.invoice-brand p,.invoice-meta{font-size:12px;color:var(--muted);line-height:1.6}
.invoice-title{font:26px var(--font-display);margin:10px 0 14px}
.invoice-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.invoice-summary .stat-box{padding:12px}
.invoice-summary .val{font:22px var(--font-display)}
.invoice-table{width:100%;border-collapse:collapse;margin:12px 0}
.invoice-table th,.invoice-table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
.invoice-table th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.invoice-table td:last-child,.invoice-table th:last-child{text-align:right}
.invoice-print-area{display:none}
.proc-line{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(110px,.8fr) auto;gap:8px;align-items:center;margin:8px 0}
.proc-line .remove-procedure{padding:8px 10px}
.invoice-stamp{width:116px;height:116px;border:3px double #8a6a2a;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#8a6a2a;font-weight:800;letter-spacing:.08em;line-height:1.2;transform:rotate(-9deg);margin:20px 0 0 auto;opacity:.88}
.invoice-stamp strong{font:700 13px Arial,sans-serif}.invoice-stamp span{font:700 8px Arial,sans-serif;margin-top:5px}.invoice-stamp small{font:700 7px Arial,sans-serif;margin-top:4px}
@media(max-width:520px){.proc-line{grid-template-columns:minmax(0,1fr) minmax(95px,.7fr) auto}.proc-line .inp{min-width:0}}
@media print{
 @page{size:A4;margin:14mm}
 body{background:#fff!important;color:#2F2619!important}
 body *{visibility:hidden!important}
 #visitInvoicePrint,#visitInvoicePrint *{visibility:visible!important}
 #visitInvoicePrint{display:block!important;position:fixed;top:0;left:0;right:0;width:100%;min-height:100vh;padding:0;background:#fff!important;color:#2F2619!important;font-family:Arial,sans-serif}
 #visitInvoicePrint .invoice-brand h2,#visitInvoicePrint .invoice-title{color:#2F2619!important}
 #visitInvoicePrint .invoice-brand p,#visitInvoicePrint .invoice-meta{color:#6c6255!important}
 #visitInvoicePrint table{width:100%;border-collapse:collapse}
 #visitInvoicePrint th,#visitInvoicePrint td{padding:9px;border-bottom:1px solid #ddd;text-align:left}
 #visitInvoicePrint th:last-child,#visitInvoicePrint td:last-child{text-align:right}
 #visitInvoicePrint .invoice-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
 #visitInvoicePrint .stat-box{border:1px solid #ddd;padding:12px}
 #visitInvoicePrint .val{font-size:18px;font-weight:bold}
 #visitInvoicePrint .invoice-stamp{break-inside:avoid}
}
/* reference dashboard proportions */
@media(min-width:901px){#appView{padding:0}.app{max-width:none;min-height:100vh;border-radius:0;grid-template-columns:250px minmax(0,1fr)}.side{border-radius:0;padding:18px 12px}.main{padding:26px 28px}.stats-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.dash-layout{grid-template-columns:minmax(0,1.6fr) minmax(250px,.8fr)}}


@media (max-width:1180px){.dash-layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  #appView{padding:0}
  .app{grid-template-columns:minmax(0,1fr);border-radius:0;border:0}
  .side{border-right:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px;gap:12px}
  .nav{flex-direction:row;overflow-x:auto}
  .nav button{width:auto;white-space:nowrap}
  .nav-label,.user-box{display:none}
  .main{padding:20px 16px 28px}
  .page-head h1{font-size:32px}
  .two-col,.hist{grid-template-columns:minmax(0,1fr)}
  .req-item{grid-template-columns:minmax(0,1fr)}
  .btns{justify-content:flex-start}
  .tl{grid-template-columns:minmax(0,1fr);gap:4px}
}

/* Screenshot-matched clinic desk refinement */
@media(min-width:901px){
 #appView{padding:0}.app{min-height:100vh;border:0;border-radius:0;grid-template-columns:250px minmax(0,1fr)}
 .side{position:sticky;top:0;height:100vh;border-radius:0;padding:18px 12px}
 .main{padding:26px 28px;max-width:1600px;width:100%;margin:0 auto}
 .page-head{margin-bottom:16px}.page-head h1{font-size:36px}
 .stats-grid{gap:9px;margin-bottom:14px}.stat-box{padding:12px 13px;border-radius:12px}
 .stat-box .val{font-size:27px}.card{padding:15px;border-radius:14px}
 .dash-layout{grid-template-columns:minmax(0,1.65fr) minmax(250px,.75fr);gap:12px}
 .col{gap:12px}.two-col{gap:12px}
 .tbl th{padding:7px 8px;font-size:10px}.tbl td{padding:8px;font-size:12px}
 .nav{gap:2px}.nav button{padding:9px 10px;border-radius:9px;font-size:12.5px}
 .brand b{font-size:16px}
 .hist{grid-template-columns:240px minmax(0,1fr);gap:14px}
}
@media(max-width:900px){.page-head h1{font-size:30px}.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.activity-list .row{font-size:11px;padding:7px 0}
.security-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.patient-calendar{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 14px;box-shadow:var(--shadow);position:static;align-self:start}
.patient-calendar-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.patient-calendar-title{font-family:var(--font-display);font-size:23px;color:var(--ink)}
.patient-calendar-nav{display:flex;align-items:center;gap:7px}
.patient-calendar-nav button,.patient-date-all{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:7px 11px;font-weight:600}
.patient-calendar-nav button:hover,.patient-date-all:hover{background:var(--sand-soft)}
.patient-calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.patient-calendar-grid .weekday{text-align:center;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em;padding:4px}
.patient-day{position:relative;min-height:39px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);font-weight:600}
.patient-day:hover{background:var(--surface2);border-color:var(--line)}
.patient-day.muted-day{color:var(--muted);opacity:.4}
.patient-day.selected{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.patient-day.today:not(.selected){border-color:var(--sand);background:var(--surface2)}
.patient-day .dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--sand)}
.patient-day.selected .dot{background:var(--accent-ink)}
.patient-calendar-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;color:var(--muted);font-size:12px}
@media(max-width:600px){.patient-calendar{padding:12px}.patient-day{min-height:34px}.patient-calendar-title{font-size:20px}}

.patient-workspace{display:grid;grid-template-columns:minmax(190px,1fr) 310px;gap:18px;align-items:start}
.patient-summary{display:grid;gap:12px;align-content:start}
.patient-summary .stat-box{min-height:112px}
.patient-summary .val{font:30px var(--font-display)}
.patient-list-panel{min-width:0;grid-column:1/-1}
.patient-calendar .patient-day{min-height:36px}
.patient-calendar .patient-calendar-title{font-size:20px}

<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const localDateKey = value => { if(!value)return ''; const raw=String(value).trim(); const iso=/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(raw)?raw.replace(' ','T')+'Z':raw; const d=new Date(iso); return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Karachi',year:'numeric',month:'2-digit',day:'2-digit'}).format(d); };
const pkDateTime = value => { if (!value) return '—'; const raw=String(value).trim(); const iso=/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(raw)?raw.replace(' ','T')+'Z':raw; const d=new Date(iso); if(Number.isNaN(d.getTime()))return raw; return new Intl.DateTimeFormat('en-PK',{timeZone:'Asia/Karachi',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).format(d)+' PKT'; };

const todayStr = () => { const p = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Karachi',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()); const v=Object.fromEntries(p.map(x=>[x.type,x.value])); return v.year+'-'+v.month+'-'+v.day; };
const plusDays = n => { const [y,m,d]=todayStr().split('-').map(Number); const dt=new Date(Date.UTC(y,m-1,d+n)); return dt.getUTCFullYear()+'-'+pad(dt.getUTCMonth()+1)+'-'+pad(dt.getUTCDate()); };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const nice = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return pad(d) + ' ' + MON[m - 1] + ' ' + y; };
const wday = s => { const [y, m, d] = s.split('-').map(Number); return WD[new Date(y, m - 1, d).getDay()]; };
const t12 = t => { if (!t) return ''; let [h, m] = String(t).split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return pad(h) + ':' + pad(m || 0) + ' ' + ap; };
const initials = n => String(n || '?').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
/* phones are stored in messy forms like "+92+923125393234" -> always compare on the last 10 digits */
const last10 = p => String(p || '').replace(/\D/g, '').slice(-10);

  no_show: ['bad', 'No-show'], rejected: ['bad', 'Rejected'], cancelled: ['mute', 'Cancelled']
};

const appointmentIsFuture = a => { const d=new Date(String(a.date||'')+'T'+String(a.time||'00:00').slice(0,5)+':00+05:00'); return Number.isFinite(d.getTime()) && d.getTime()>Date.now(); };

const state = { page: 'dashboard', profile: null, profileUnlocked: false, securityDriveOpen:false, tab: 'pending', filter: 'all', patientDate: null, patientShowOverall: false, calendarMonth: todayStr().slice(0,7), histSel: null, histQ: '', appts: [], patients: [], doctors: [], visits: [], financialPatients: [], sig: '', driveAllowed:false, driveData:null, driveJobs:[], driveFolders:[], driveBackfill:{after_visit_id:0,after_patient_id:0,has_more:true} };

/* ---------- api ---------- */
async function api(path, opts) {
  const o = Object.assign({ credentials: 'same-origin', cache: 'no-store', headers: { 'Content-Type': 'application/json' } }, opts || {});
  if (o.body && typeof o.body !== 'string') o.body = JSON.stringify(o.body);
  const res = await fetch(path, o);
  if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
  let data = null; try { data = await res.json(); } catch (e) { }
  return { ok: res.ok, status: res.status, data: data || {} };
}

let beepCtx = null;
let soundEnabled = localStorage.getItem('ue_admin_sound') !== 'off';
function beep() {
  if (!soundEnabled) return;
  try {
    beepCtx = beepCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (beepCtx.state === 'suspended') beepCtx.resume();
    [0, .34, .68].forEach((delay, i) => {
      const o = beepCtx.createOscillator(), g = beepCtx.createGain();
      const start = beepCtx.currentTime + delay;
      o.type = 'sine'; o.frequency.value = [880, 1046, 1318][i];
      g.gain.setValueAtTime(.0001, start); g.gain.exponentialRampToValueAtTime(.48, start + .025);
      g.gain.exponentialRampToValueAtTime(.0001, start + .22);

    });
  } catch (e) { }
}
function vibrate(pattern) { try { if (navigator.vibrate) navigator.vibrate(pattern || [35,25,45]); } catch(e) {} }
function playWrongPasswordAlert(){try{beepCtx=beepCtx||(new (window.AudioContext||window.webkitAudioContext)());if(beepCtx.state==='suspended')beepCtx.resume();[0,.10,.20,.32].forEach((delay,i)=>{const o=beepCtx.createOscillator(),g=beepCtx.createGain(),t=beepCtx.currentTime+delay;o.type='square';o.frequency.value=[520,660,880,1040][i];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.075);o.connect(g);g.connect(beepCtx.destination);o.start(t);o.stop(t+.08);});}catch(e){}vibrate([45,35,70]);}
function playClickTone() {
 if (!soundEnabled) return;
 try {

  if(beepCtx.state==='suspended')beepCtx.resume();

  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.085);
  o.connect(g);g.connect(beepCtx.destination);o.start(t);o.stop(t+.09);
 } catch(e) {}
}
function playInvoiceReminder() {
 // Three-second reminder after check-in; independent of the optional UI click sound.
 try {
  beepCtx=beepCtx||(new (window.AudioContext||window.webkitAudioContext)());
  if(beepCtx.state==='suspended')beepCtx.resume();

async function refreshNotificationAccessButton() {
  const b = $('#notificationAccessBtn');
  if (!b) return;
  if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
    b.textContent = 'Push Notifications Unsupported'; b.disabled = true; return;
  }
  if (Notification.permission === 'denied') {
    b.textContent = 'Notifications Blocked in Browser'; b.disabled = true; return;
  }
  b.disabled = false;
  b.textContent = Notification.permission === 'granted' ? 'Enable Background Alerts' : 'Enable Notifications';
  try {
    const response = await fetch('/api/admin/push-subscription', { credentials:'same-origin', cache:'no-store' });
    if (response.ok) {
      const data = await response.json();
      const registration = await navigator.serviceWorker.ready;
      const localSubscription = await registration.pushManager.getSubscription();
      if (data.subscribed && localSubscription && Notification.permission === 'granted') b.textContent = 'Background Alerts: On';
      else if (!data.publicKey) b.textContent = 'Push Setup Required';
      else if (data.subscribed && !localSubscription) b.textContent = 'Reconnect Background Alerts';
    }
  } catch(e) {}
}
function decodeVapidKey(value) {
  const padding = '='.repeat((4 - value.length % 4) % 4);
  const base64 = (value + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from(raw, ch => ch.charCodeAt(0));
}
async function enableClinicNotifications() {
  if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
    toast('Background push is not supported by this browser.'); return;
  }
  const b = $('#notificationAccessBtn');
  if (b) { b.disabled = true; b.textContent = 'Setting up alerts…'; }
  try {
    const permission = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
    if (permission !== 'granted') {
      toast(permission === 'denied' ? 'Allow notifications from browser site settings.' : 'Notification permission was not granted.');
      return;
    }
    const info = await api('/api/admin/push-subscription');
    if (!info.ok || !info.data.publicKey) {
      toast(info.data.error || 'Push service is not configured on this Preview yet.'); return;
    }
    const reg = await navigator.serviceWorker.ready;
    let subscription = await reg.pushManager.getSubscription();
    if (!subscription) {
      subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: decodeVapidKey(info.data.publicKey)
      });
    }
    const saved = await api('/api/admin/push-subscription', {
      method:'POST',
      body:{ subscription: subscription.toJSON() }
    });
    if (!saved.ok) throw new Error(saved.data.error || 'Could not save this device subscription.');
    toast(saved.data.test_push_accepted
      ? 'Push service accepted a test alert. Check this device’s notification center.'
      : 'Background appointment alerts are enabled on this device.');
  } catch (e) {
    toast(e.message || 'Could not enable background alerts. Check browser notification settings.');
  } finally {
    await refreshNotificationAccessButton();
  }
}
document.addEventListener('click', e => {
  if (e.target && e.target.id === 'notificationAccessBtn') enableClinicNotifications();
});

  try { r = await api('/api/admin/appointments'); } catch (e) { if (e && e.message === 'unauthorized') throw e; return; }
  if (!r.ok) { if (first) toast('Unable to load data (' + r.status + ')'); return; }
  const raw = Array.isArray(r.data) ? r.data : (r.data.appointments || []);
  const appts = raw.map(a => ({
    id: a.id, pid: a.patient_id, name: a.patient_name || 'Unknown', phone: a.patient_phone || '',
    did: a.doctor_id, doc: a.doctor_name || '', date: a.date || '', time: String(a.time || '').slice(0, 5),
    proc: a.treatment || '', token: a.daily_token || null, status: a.checked_in_at && a.status === 'confirmed' ? 'in_room' : (a.status === 'noshow' ? 'no_show' : a.status), source: a.source || '', fu: a.follow_up_date || ''
  }));
  const pendingIds = appts.filter(a => a.status === 'pending').map(a => String(a.id));
  if (seenPendingIds !== null && pendingIds.some(id => !seenPendingIds.has(id))) {
    playAppointmentAlert(); toast('New website booking request!');
  }
  seenPendingIds = new Set(pendingIds);

  try { const vr = await api('/api/admin/visits'); if (vr.ok) { state.visits = vr.data.visits || []; state.financialPatients = vr.data.patients || []; } } catch(e) { if (e && e.message === 'unauthorized') throw e; }
  const sig = JSON.stringify(appts) + JSON.stringify(state.visits);
  const changed = sig !== state.sig;
  state.sig = sig; state.appts = appts;
  const pm = {};
  appts.forEach(a => { (pm[a.pid] = pm[a.pid] || { id: a.pid, name: a.name, phone: a.phone, appts: [] }).appts.push(a); });
  // Keep the complete patient register, including patients with no recent booking.
  const merged = new Map(Object.values(pm).map(p => [Number(p.id), p]));
  (state.financialPatients || []).forEach(p => {
    const id = Number(p.id), existing = merged.get(id);
    if (existing) { existing.name = p.name || existing.name; existing.phone = p.phone || existing.phone; }
    else merged.set(id, { id, name: p.name || 'Unknown', phone: p.phone || '', appts: [] });
  });
  state.patients = [...merged.values()].sort((x, y) => x.id - y.id);
  if (!state.histSel && state.patients.length) state.histSel = state.patients[0].id;

  if (first || !state.doctors.length) await loadDoctors();
  const ae = document.activeElement;
  const typing = ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && $('#appView').contains(ae);
  if (first || (changed && !typing)) render(); else renderNav();
}

async function loadDoctors() {
  let list = [];
  try {
    const r = await fetch('/api/doctors', { credentials: 'same-origin' });
    if (r.ok) { const d = await r.json(); list = (Array.isArray(d) ? d : (d.doctors || [])).filter(x => x.is_active !== 0).map(x => ({ id: x.id, name: x.name })); }
  } catch (e) { }
  if (!list.length) {
    const m = {}; state.appts.forEach(a => { if (a.did && a.doc) m[a.did] = a.doc; });
    list = Object.keys(m).map(k => ({ id: Number(k), name: m[k] }));
  }
  state.doctors = list;
}

async function setStatus(id, status, msg) {

let previewSeedPromise = null;
async function ensurePreviewSeed(username,password) {
  const host = location.hostname;
  if (host === 'ultimate-esthetics-demo.pages.dev' || !host.endsWith('.ultimate-esthetics-demo.pages.dev')) return null;
  if (!previewSeedPromise) {
    const btn = $('#loginBtn'),wasDisabled=!!btn?.disabled,oldText=btn?.textContent||'Sign In';
    if (btn) { btn.disabled = true; btn.textContent = 'Preparing Preview...'; }
    previewSeedPromise = (async () => {
      const response = await fetch('/api/preview/seed', {
        method:'POST', credentials:'same-origin', cache:'no-store',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username,password})
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.success !== true) throw new Error(data.error || 'Could not prepare Preview database.');
      return data;
    })().catch(error => {
      previewSeedPromise = null;
      throw error;
    }).finally(() => {
      if (btn) { btn.disabled = wasDisabled; btn.textContent = oldText; }
    });
  }
  return previewSeedPromise;
}
async function boot(afterLogin = false) {
  try {
    const res = await fetch('/api/admin/appointments', { credentials: 'same-origin', cache: 'no-store' });
    if (res.status === 401) {
      showLogin();
      if (afterLogin) {
        const err = $('#loginErr');
        err.textContent = 'The password was accepted, but the server did not receive a valid session cookie. Open the latest Preview link (not an older deployment URL), then sign in again.';
        err.hidden = false;
      }
      return false;
    }
    if (!res.ok) {
      showLogin();
      const err = $('#loginErr');
      err.textContent = 'Server API error (' + res.status + '). Please check the deployment configuration.';
      err.hidden = false;
      return false;
    }
    showApp();
    await loadData(true);
    await loadDriveSettings(false);
    await refreshNotificationAccessButton();
    render();
    showDriveOAuthResult();
    updateSoundButton();
    if (!timer) timer = setInterval(() => loadData(false), 8000);
    return true;
  } catch (e) {
    showLogin();
    const err = $('#loginErr');
    err.textContent = e && e.message === 'unauthorized'
      ? 'The admin session was rejected by the API. Please sign in again using the latest Preview URL.'
      : (e && e.message ? e.message : 'Unable to connect to the server. The admin API is unavailable.');
    err.hidden = false;
    return false;
  }
}

async function openGoogleDrivePicker(){

async function runDriveBackfill(showToast=true){
 let cursor=state.driveBackfill||{after_visit_id:0,after_patient_id:0,has_more:true};
 let totalVisits=0,totalPatients=0,rounds=0,hasMore=true;
 while(hasMore&&rounds<25){
  const result=await api('/api/admin/drive/sync',{method:'POST',body:{action:'backfill',after_visit_id:cursor.after_visit_id,after_patient_id:cursor.after_patient_id}});
  if(!result.ok)throw new Error(result.data.error||'Could not start Drive backfill.');
  totalVisits+=Number(result.data.scheduled_visits||0);
  totalPatients+=Number(result.data.scheduled_patients||0);
  cursor={after_visit_id:result.data.next_after_visit_id,after_patient_id:result.data.next_after_patient_id,has_more:!!result.data.has_more};
  hasMore=cursor.has_more;rounds++;
  if(hasMore)await new Promise(resolve=>setTimeout(resolve,900));
 }
 state.driveBackfill=hasMore?cursor:{after_visit_id:0,after_patient_id:0,has_more:false};
 if(showToast)toast('Scheduled '+totalVisits+' visits and '+totalPatients+' patient records for Drive.'+(hasMore?' More records remain; click Sync all existing records again.':' Existing records backfill has been queued.'));
 return {totalVisits,totalPatients,hasMore};
}

  r=await api('/api/admin/visits',{method:'POST',body:{appointment_id:Number(form.dataset.id),procedures,subtotal_amount:total,discount_type:discountType,discount_value:discountValue,received_now:received,payment_method:$('#visitMethod').value,notes:$('#visitNotes').value,follow_up_date:$('#visitFollow').value||null}});
  if(!r.ok){err.textContent=r.data.error||'Unable to save the visit.';err.hidden=false;btn.disabled=false;btn.textContent='Save visit & payment';return;}
  a.invoice_number=r.data.invoice_number;form.dataset.invoiceNumber=r.data.invoice_number;form.dataset.saved='1';btn.disabled=true;btn.textContent='Saved · '+r.data.invoice_number;const notice=$('#visitInvoiceNumberNotice');if(notice)notice.textContent='Permanent invoice number: '+r.data.invoice_number;const modal=$('#visitModal');if(modal&&modal._renderInvoice)modal._renderInvoice();const printBtn=document.querySelector('#visitModal [data-act="printinvoice"]');if(printBtn)printBtn.textContent='Print invoice · '+r.data.invoice_number;toast('Invoice '+r.data.invoice_number+' saved. Remaining balance Rs '+r.data.balance+'.');await loadData();
 }
}
 catch(x){if(x.message!=='unauthorized'){err.textContent='Server connection error.';err.hidden=false;}btn.disabled=false;btn.textContent='Save visit & payment';}
});

document.addEventListener('submit', async e => {
  if (e.target.id !== 'manualForm') return;
  e.preventDefault();
  const err = $('#mErr'), btn = $('#mBtn'); err.hidden = true;
  const name = $('#mName').value.trim(), ph = last10($('#mPhone').value), did = Number($('#mDoc').value), date = $('#mDate').value, time = $('#mTime').value, proc = $('#mProc').value.trim(), manualSubtotal = $('#mSubtotal').value.trim(), manualReceived = Number($('#mReceived').value||0), discountType=$('#mDiscountType').value, discountValue=Number($('#mDiscountValue').value||0), referredBy=$('#mReferral').value, referralNotes=$('#mReferralNotes').value.trim();
  const fail = m => { err.textContent = m; err.hidden = false; };
  if (!name) return fail('Enter the patient name.');
  if (ph.length < 10) return fail('Enter a valid 10-digit Pakistani mobile number.');
  if (!did) return fail('Select a doctor.');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    const r = await api('/api/admin/manual', { method: 'POST', body: { name, phone: ph, doctor_id: did, date, time, treatment: proc || null, manual_subtotal: manualSubtotal===''?undefined:Number(manualSubtotal), received_now: manualReceived, discount_type: discountType, discount_value: discountValue, payment_method: $('#mPaymentMethod').value, follow_up_date: $('#mFollow').value||null, referred_by_patient_id: referredBy?Number(referredBy):null, referral_notes: referralNotes } });
    if (!r.ok) { fail(r.data.error || 'Unable to save the appointment (' + r.status + ').'); }
    else {
      await loadData();
      toast('Walk-in patient added (#' + r.data.patient_id + ').' + (r.data.invoice?(r.data.invoice.payment_only?'Payment received; remaining balance Rs '+r.data.invoice.balance+'.':'Invoice '+r.data.invoice.invoice_number+' saved; balance Rs '+r.data.invoice.balance+'.'):''));
      state.tab = 'accepted'; state.filter = 'all'; go(date === todayStr() ? 'today' : 'requests');
      return;
    }
  } catch (x) { if (x.message !== 'unauthorized') fail('Unable to connect to the server.'); }
  btn.disabled = false; btn.textContent = 'Add & confirm';
});

let deferredInstallPrompt = null;
const installAppButton = document.getElementById("installAppBtn");
const INSTALL_FLAG = "ultimateClinicInstalled";
const isClinicInstalled = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true || localStorage.getItem(INSTALL_FLAG) === "yes";
const syncInstallControl = () => {
  if (installAppButton && isClinicInstalled()) {
    installAppButton.hidden = true;
    deferredInstallPrompt = null;
  }
};
syncInstallControl();
window.addEventListener("beforeinstallprompt", event => {
  if (isClinicInstalled()) { event.preventDefault(); syncInstallControl(); return; }
  event.preventDefault();
  deferredInstallPrompt = event;
  if (installAppButton) { installAppButton.hidden = false; installAppButton.textContent = "Install Clinic App"; }
});
window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  if (installAppButton) installAppButton.hidden = true;
});
if (installAppButton) installAppButton.addEventListener("click", async () => {
  if (isClinicInstalled()) { syncInstallControl(); return; }
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    if (choice && choice.outcome === "accepted") { localStorage.setItem(INSTALL_FLAG, "yes"); installAppButton.hidden = true; }
  } else {
    toast("To install: open the browser menu and choose Install app or Add to Home screen.");
  }
});
let waitingClinicWorker = null;
function showClinicUpdateNotice(reg) {
  if (!reg || !reg.waiting || !navigator.serviceWorker.controller) return;
  waitingClinicWorker = reg.waiting;
  const notice = $('#appUpdateNotice');
  if (notice) notice.classList.add('show');
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification('Ultimate Esthetics update ready', { body:'A new Clinic Desk version is ready. Tap Update app when convenient.', icon:'/admin/icon.svg', tag:'clinic-app-update' }); } catch(e) {}
  }
}
document.addEventListener('click', e => {
  if (e.target.closest('#dismissAppUpdate')) { $('#appUpdateNotice')?.classList.remove('show'); return; }
  if (e.target.closest('#applyAppUpdate')) {
    if (waitingClinicWorker) waitingClinicWorker.postMessage({type:'SKIP_WAITING'});
    else location.reload();
  }
});
if ("serviceWorker" in navigator) {
  (async () => {
    try {
      const reg = await navigator.serviceWorker.register("/admin/sw.js", {scope:"/admin/"});
      if (reg.waiting && navigator.serviceWorker.controller) showClinicUpdateNotice(reg);
      reg.addEventListener('updatefound', () => {
        const worker = reg.installing;
        if (!worker) return;
        worker.addEventListener('statechange', () => {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) showClinicUpdateNotice(reg);
        });
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
      reg.update().catch(() => {});
    } catch(e) { console.error('Clinic service worker registration failed',e); }
  })();
}
boot();
</script>
