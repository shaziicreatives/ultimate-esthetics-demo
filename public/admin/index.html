<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Ultimate Esthetics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Login Screen -->
    <div id="loginSection" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Clinic Admin Login</h2>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" required class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" required class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div id="loginError" class="text-red-500 text-sm hidden"></div>
                <button type="submit" class="w-full bg-slate-900 text-white py-2 rounded-lg font-semibold hover:bg-slate-800 transition">Login</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboardSection" class="hidden min-h-screen flex flex-col">
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">Ultimate Esthetics — Admin Dashboard</h1>
            <div class="flex items-center space-x-4">
                <span id="liveStatus" class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full font-medium">● Live Sync Active</span>
                <button onclick="loadAppointments()" class="bg-gray-100 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-200">Refresh Data</button>
            </div>
        </header>

        <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">Appointments Management</h2>
            <div class="bg-white rounded-xl shadow overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm border-b">
                            <th class="p-4">Date & Time</th>
                            <th class="p-4">Patient Name</th>
                            <th class="p-4">Phone</th>
                            <th class="p-4">Doctor</th>
                            <th class="p-4">Treatment</th>
                            <th class="p-4">Status</th>
                            <th class="p-4">Actions / WhatsApp</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTable" class="divide-y text-sm text-gray-700">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Notification Audio -->
    <audio id="notificationSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        let lastCount = -1;

        // Check session automatically on page load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/admin/appointments');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    renderTable(data.appointments);
                    lastCount = data.appointments.length;
                    startPolling();
                }
            } catch (e) {
                // Stay on login if unauthorized
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('loginError');

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    loadAppointments();
                    startPolling();
                } else {
                    errDiv.textContent = data.error || 'Login failed';
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                errDiv.textContent = 'Connection error.';
                errDiv.classList.remove('hidden');
            }
        }

        async function loadAppointments() {
            try {
                const res = await fetch('/api/admin/appointments');
                if (!res.ok) {
                    if (res.status === 401) {
                        document.getElementById('loginSection').classList.remove('hidden');
                        document.getElementById('dashboardSection').classList.add('hidden');
                        return;
                    }
                    throw new Error('Failed to fetch');
                }
                const data = await res.json();
                
                // Play sound if new appointment arrives
                if (lastCount !== -1 && data.appointments.length > lastCount) {
                    document.getElementById('notificationSound').play().catch(e => console.log(e));
                }
                lastCount = data.appointments.length;
                renderTable(data.appointments);
            } catch (err) {
                console.error(err);
            }
        }

        function renderTable(appointments) {
            const tbody = document.getElementById('appointmentsTable');
            tbody.innerHTML = '';

            if (appointments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-500">No appointments found.</td></tr>`;
                return;
            }

            appointments.forEach(app => {
                const tr = document.createElement('tr');
                
                // Action buttons or WhatsApp link based on status
                let actionHtml = '';
                if (app.status === 'pending') {
                    actionHtml = `
                        <button onclick="updateStatus(${app.id}, 'confirmed')" class="bg-green-100 text-green-700 px-3 py-1 rounded text-xs font-semibold hover:bg-green-200">Confirm</button>
                        <button onclick="updateStatus(${app.id}, 'rejected')" class="bg-red-100 text-red-700 px-3 py-1 rounded text-xs font-semibold hover:bg-red-200">Reject</button>
                    `;
                } else {
                    const waText = encodeURIComponent(`Hello ${app.patient_name}, your appointment at Ultimate Esthetics for ${app.treatment || 'Consultation'} on ${app.date} at ${app.time} has been *${app.status.toUpperCase()}*.`);
                    const waLink = `https://wa.me/${app.patient_phone.replace(/[^0-9]/g, '')}?text=${waText}`;
                    actionHtml = `
                        <span class="text-xs font-medium text-gray-500 mr-2">Action Done</span>
                        <a href="${waLink}" target="_blank" class="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-semibold hover:bg-emerald-700 inline-flex items-center gap-1">
                            💬 Send WhatsApp
                        </a>
                    `;
                }

                tr.innerHTML = `
                    <td class="p-4 whitespace-nowrap">${app.date} <br><span class="text-xs text-gray-400">${app.time}</span></td>
                    <td class="p-4 font-medium">${app.patient_name}</td>
                    <td class="p-4">${app.patient_phone}</td>
                    <td class="p-4">${app.doctor_name}</td>
                    <td class="p-4">${app.treatment || 'Consultation'}</td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${getStatusBadge(app.status)}">${app.status}</span></td>
                    <td class="p-4 whitespace-nowrap">${actionHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getStatusBadge(status) {
            switch(status) {
                case 'confirmed': return 'bg-green-100 text-green-800';
                case 'pending': return 'bg-yellow-100 text-yellow-800';
                case 'done': return 'bg-blue-100 text-blue-800';
                case 'rejected': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        async function updateStatus(id, status) {
            try {
                const res = await fetch('/api/admin/appointments', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, status })
                });
                if (res.ok) {
                    loadAppointments();
                } else {
                    alert('Failed to update status');
                }
            } catch (err) {
                alert('Error updating status');
            }
        }

        // Poll for new appointments every 10 seconds
        function startPolling() {
            setInterval(loadAppointments, 10000);
        }
    </script>
</body>
</html>
