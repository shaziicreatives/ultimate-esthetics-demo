<!doctype html>
<html lang="en">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ultimate Esthetics Clinic Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
:root{
  --bg:#FAF6EE; --surface:#FFFFFF; --surface2:#F4EDE1; --ink:#2F2619; --muted:#7A6A50; --line:#E0D4BC;
  --accent:#3E3325; --accent-ink:#FFFFFF; --sand:#D8C6A2; --sand-soft:#EBE2D2;
  --wa:#15A046; --wa-ink:#FFFFFF;
  --ok:#287D43; --ok-bg:#E2F2E6; --warn:#9B6E1A; --warn-bg:#F8EFDB; --bad:#B84337; --bad-bg:#F9E5E2; --info:#3B6B98; --info-bg:#E2ECF5;
  --shadow:0 2px 8px rgba(47,38,25,.06);
  --font-display:'Instrument Serif',Georgia,serif; --font-body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* LOGIN OVERLAY */
#loginView{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:36px;width:100%;max-width:380px;box-shadow:var(--shadow);text-align:center}
.login-card .brand-mark{width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-size:26px;margin:0 auto 12px}
.login-card h2{font-family:var(--font-display);font-size:28px;font-weight:400;margin-bottom:4px}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:20px}

/* MAIN APP LAYOUT */
#appView{width:100%;min-height:100vh;padding:16px;background:var(--bg)}
.app{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;
  display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 32px);max-width:1440px;margin:0 auto}
.side{background:var(--surface2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-size:22px}
.brand b{display:block;font-family:var(--font-display);font-weight:400;font-size:18px;line-height:1.1}
.brand span{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:-8px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:500;font-size:13.5px}
.nav button:hover{background:var(--sand-soft);color:var(--ink)}
.nav button.on{background:var(--accent);color:var(--accent-ink)}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--bad);color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.user-box{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sand-soft);border:1px solid var(--sand);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:var(--accent)}
.user-box small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.user-box b{font-size:13px}
.foot-btns{display:flex;gap:6px}

.main{padding:26px 30px;min-width:0;background:var(--surface)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-family:var(--font-display);font-weight:400;font-size:42px;line-height:1}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:4px}
.actions{display:flex;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--sand);background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wa{background:var(--wa);color:var(--wa-ink);border-color:var(--wa)}
.btn.bad{color:var(--bad);border-color:var(--bad-bg);background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}
.card.tint{background:var(--surface2)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h2{font-size:15px;font-weight:700}

.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.stat-box{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat-box .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat-box .val{font-family:var(--font-display);font-size:30px;line-height:1}
.stat-box .sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.stat-box.hero{background:var(--accent);color:#fff}
.stat-box.hero .lbl,.stat-box.hero .sub{color:#ffffffa6}

.dash-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
.right{text-align:right}

.who{display:flex;align-items:center;gap:10px}
.who b{display:block;line-height:1.2;font-size:13.5px}
.who small{color:var(--muted);font-size:12px}
.id{font-weight:700;color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.chip{display:inline-block;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--sand-soft);color:var(--muted)}

.tabs{display:inline-flex;gap:4px;background:var(--surface2);border:1px solid var(--line);padding:3px;border-radius:12px;margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--muted);font-size:13px}
.tabs button.on{background:var(--accent);color:#fff}
.tabs .n{font-size:11px;padding:1px 6px;border-radius:99px;background:#ffffff33;margin-left:4px}

.req-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.req-item:last-child{border-bottom:0}
.req-meta{display:flex;gap:6px;align-items:center;margin-top:4px}
.req-time-box{text-align:center}
.req-time-box label{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.req-time-box select{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px}
.empty{padding:24px 10px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--accent);color:#fff;padding:10px 16px;border-radius:12px;z-index:9999;font-weight:500;box-shadow:var(--shadow)}

@media(max-width:1024px){.stats-grid{grid-template-columns:repeat(3,1fr)}.dash-layout{grid-template-columns:1fr}}
@media(max-width:768px){#appView{padding:0}.app{grid-template-columns:1fr;border-radius:0}.side{height:auto}}
</style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="loginView">
  <div class="login-card">
    <div class="brand-mark">U</div>
    <h2>Ultimate Esthetics</h2>
    <p>Sign in to access clinic desk</p>
    <form style="display:flex;flex-direction:column;gap:12px;text-align:left" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="uName">Username</label>
        <input class="inp" id="uName" type="text" required placeholder="Enter username" autocomplete="username">
      </div>
      <div class="field">
        <label for="uPass">Password</label>
        <input class="inp" id="uPass" type="password" required placeholder="Enter password" autocomplete="current-password">
      </div>
      <div id="loginErr" style="color:var(--bad);font-size:12.5px" hidden></div>
      <button class="btn pri" type="submit" id="loginBtn" style="width:100%;margin-top:4px">Sign In</button>
    </form>
  </div>
</div>

<!-- APP MAIN VIEW -->
<div id="appView" style="display:none">
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="brand-mark">U</div>
        <div><b>Ultimate Esthetics</b><span>Clinic Desk</span></div>
      </div>
      <div class="nav-label">Daily Work</div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="user-box">
          <div class="avatar">OW</div>
          <div><b>Owner</b><small>Full access</small></div>
        </div>
        <div class="foot-btns">
          <button class="btn sm" id="themeBtn" type="button" style="flex:1">Theme</button>
          <button class="btn sm" id="logoutBtn" type="button" onclick="handleLogout()" style="flex:1">Logout</button>
        </div>
      </div>
    </aside>
    <main class="main"><div id="view"></div></main>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const t12 = t => { if(!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return pad(h) + ':' + pad(m) + ' ' + ap; };
const initials = n => n.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();

const DOCTORS = ['Dr. Ayesha Malik', 'Dr. Hamza Raza', 'Dr. Sana Iqbal'];
const PROCS = { 'Consultation': 1500, 'Hydrafacial': 8000, 'Chemical Peel': 6500, 'Laser Hair Removal': 12000, 'Hair PRP': 18000, 'Botox': 25000, 'Dermal Filler': 35000 };
const SLOTS = ['11:00', '11:30', '12:00', '12:30', '13:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00', '17:30'];
const PAGES = [['dashboard', 'Dashboard'], ['requests', 'Requests'], ['today', "Today's Patients"], ['manual', 'Manual Patient'], ['history', 'Patient History'], ['security', 'Security']];

let state = { page: 'dashboard', tab: 'pending', appts: [], patients: [], requests: [] };
const toastEl = $('#toast'); let toastT;
const toast = m => { toastEl.textContent = m; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, 3600); };
const stPill = s => ({ confirmed: '<span class="pill info">Awaiting check-in</span>', inroom: '<span class="pill warn">In room</span>', done: '<span class="pill ok">Done</span>', noshow: '<span class="pill bad">No-show</span>', pending: '<span class="pill warn">Pending</span>', rejected: '<span class="pill bad">Rejected</span>' }[s] || '<span class="pill info">' + s + '</span>');

let audioCtx = null;
function playBeep() {
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } catch(e) {}
}

let lastCount = -1, liveInterval = null;

async function handleLogin(e) {
  e.preventDefault();
  const username = $('#uName').value.trim(), password = $('#uPass').value.trim();
  const errEl = $('#loginErr'), btn = $('#loginBtn');
  errEl.hidden = true; btn.disabled = true; btn.textContent = 'Verifying...';

  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if(res.ok && data.success) {
      localStorage.setItem('admin_auth', 'true');
      showDashboard();
    } else {
      errEl.textContent = data.error || 'Invalid credentials.'; errEl.hidden = false;
    }
  } catch(err) {
    errEl.textContent = 'Connection error.'; errEl.hidden = false;
  }
  btn.disabled = false; btn.textContent = 'Sign In';
}

function handleLogout() {
  localStorage.removeItem('admin_auth');
  if(liveInterval) clearInterval(liveInterval);
  $('#appView').style.display = 'none'; $('#loginView').style.display = 'flex';
}

function checkSession() {
  if(localStorage.getItem('admin_auth') === 'true') showDashboard();
  else { $('#loginView').style.display = 'flex'; $('#appView').style.display = 'none'; }
}

function showDashboard() {
  $('#loginView').style.display = 'none'; $('#appView').style.display = 'block';
  loadData(); if(!liveInterval) liveInterval = setInterval(loadData, 5000);
}

async function loadData() {
  try {
    const res = await fetch('/api/admin/appointments');
    if(res.status === 401) { handleLogout(); return; }
    if(res.ok) {
      const data = await res.json();
      const rawAppts = data.appointments || [];

      const pendReqs = rawAppts.filter(a => a.status === 'pending' || a.status === 'pending_confirmation');
      if(lastCount !== -1 && pendReqs.length > lastCount) {
        playBeep();
        toast('🔔 New website booking request!');
      }
      lastCount = pendReqs.length;

      state.appts = rawAppts;
      let pMap = {};
      rawAppts.forEach(a => {
        if(!pMap[a.patient_id]) pMap[a.patient_id] = { id: a.patient_id, name: a.patient_name, phone: a.patient_phone };
      });
      state.patients = Object.values(pMap);

      state.requests = rawAppts.map(a => ({
        rid: a.id, name: a.patient_name, phone: a.patient_phone, doc: a.doctor_name, proc: a.treatment || 'Consultation',
        time: String(a.time||'11:00').padStart(2,'0').slice(0,5), status: a.status, pid: a.patient_id, date: a.date
      }));
    }
  } catch(e) {}
  render();
}

function viewDashboard() {
  const pend = state.requests.filter(r => r.status === 'pending' || r.status === 'pending_confirmation').length;
  const rows = state.appts.slice(0, 7).map(a => {
    let actBtn = a.status === 'confirmed' ? `<button class="btn sm pri" onclick="updateApptStatus(${a.id}, 'inroom')">Check-In</button>` :
                 a.status === 'inroom' ? `<button class="btn sm" onclick="updateApptStatus(${a.id}, 'done')">Open form</button>` : '';
    return `<tr><td><b>${t12(String(a.time||'').padStart(2,'0').slice(0,5))}</b></td><td><div class="who"><div class="avatar">${initials(a.patient_name)}</div><div><b>${esc(a.patient_name)}</b><small><span class="id">#${a.patient_id}</span> · ${esc(a.treatment||'Consultation')}</small></div></div></td><td>${esc(a.doctor_name)}</td><td>${stPill(a.status)}</td><td class="right">${actBtn}</td></tr>`;
  }).join('');

  return `<div class="page-head"><div><h1>Good evening, Owner</h1><p>Sat, 07 Nov 2026. Here is what needs you today.</p></div><div class="actions"><button class="btn" onclick="state.page='manual';render()">+ Manual patient</button><button class="btn pri" onclick="state.page='requests';render()">✉ Requests (${pend})</button></div></div>
    <div class="stats-grid">
      <div class="stat-box hero"><div class="lbl">Collected today</div><div class="val num">Rs 20,000</div><div class="sub">From 2 finished visits</div></div>
      <div class="stat-box"><div class="lbl">Total patients</div><div class="val num">${state.patients.length || 12}</div><div class="sub">IDs run #1001 to #1012</div></div>
      <div class="stat-box"><div class="lbl">Today's patients</div><div class="val num">${state.appts.length || 7}</div><div class="sub">3 still to arrive</div></div>
      <div class="stat-box"><div class="lbl">Pending requests</div><div class="val num">${pend}</div><div class="sub">Waiting for a reply</div></div>
      <div class="stat-box"><div class="lbl">Balance due</div><div class="val num">Rs 52,500</div><div class="sub">6 patients owe money</div></div>
    </div>
    <div class="dash-layout">
      <div>
        <div class="card"><div class="card-head"><h2>Today's queue</h2><button class="btn sm" onclick="state.page='today';render()">Open full list</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Time</th><th>Patient</th><th>Doctor</th><th>Status</th><th class="right">Action</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="empty">No queue today</td></tr>'}</tbody></table></div></div>
      </div>
      <div>
        <div class="card tint"><div class="who" style="gap:12px"><div class="avatar" style="width:46px;height:46px">OW</div><div><b>Owner</b><small>Login email: o---@clinic.pk</small></div></div><button class="btn sm" style="width:100%;margin-top:12px" onclick="state.page='security';render()">Open security</button></div>
      </div>
    </div>`;
}

function viewRequests() {
  const pList = state.requests.filter(r => r.status === 'pending' || r.status === 'pending_confirmation');
  const aList = state.requests.filter(r => r.status === 'confirmed');
  const rList = state.requests.filter(r => r.status === 'rejected');

  let body = '';
  if(state.tab === 'pending') {
    body = pList.length ? pList.map(r => {
      const waMsg = encodeURIComponent(`Hello ${r.name}, we can offer you ${t12(r.time)} at Ultimate Esthetics.`);
      return `<div class="req-item">
        <div class="who"><div class="avatar">${initials(r.name)}</div><div><b>${esc(r.name)}</b><small>${esc(r.phone)}</small><div class="req-meta"><span class="chip">${esc(r.proc)}</span><span class="chip">${esc(r.doc)}</span><span class="chip">New · gets #${r.pid}</span></div></div></div>
        <div class="req-time-box"><label>Time for this patient</label><select onchange="r.time=this.value"><option value="${r.time}">${t12(r.time)}</option>${SLOTS.map(s => `<option value="${s}">${t12(s)}</option>`).join('')}</select><small style="display:block;color:var(--muted);margin-top:2px">Asked for ${t12(r.time)}</small></div>
        <div style="display:flex;gap:6px"><button class="btn pri sm" onclick="updateApptStatus(${r.rid}, 'confirmed')">✓ Accept</button><a class="btn sm" target="_blank" href="https://wa.me/${r.phone.replace(/\D/g,'')}?text=${waMsg}">💬 Offer this time</a><button class="btn bad sm" onclick="updateApptStatus(${r.rid}, 'rejected')">Reject</button></div>
      </div>`;
    }).join('') : '<div class="empty">No pending requests right now.</div>';
  } else if(state.tab === 'accepted') {
    body = aList.length ? aList.map(r => {
      const waMsg = encodeURIComponent(`Hello ${r.name}, your appointment at Ultimate Esthetics is confirmed for ${t12(r.time)}.`);
      return `<div class="req-item">
        <div class="who"><div class="avatar">${initials(r.name)}</div><div><b>${esc(r.name)}</b><small>${esc(r.phone)}</small><div class="req-meta"><span class="chip">${esc(r.proc)}</span><span class="chip">${esc(r.doc)}</span></div></div></div>
        <div><span class="pill ok">● Confirmed</span><small style="display:block;color:var(--muted);margin-top:4px">${t12(r.time)} today · #${r.pid}</small></div>
        <div><a class="btn wa sm" target="_blank" href="https://wa.me/${r.phone.replace(/\D/g,'')}?text=${waMsg}">💬 Send on WhatsApp</a></div>
      </div>`;
    }).join('') : '<div class="empty">No accepted requests yet.</div>';
  } else if(state.tab === 'rejected') {
    body = rList.length ? rList.map(r => {
      const waMsg = encodeURIComponent(`Hello ${r.name}, we would like to offer another time slot for your appointment at Ultimate Esthetics.`);
      return `<div class="req-item">
        <div class="who"><div class="avatar">${initials(r.name)}</div><div><b>${esc(r.name)}</b><small>${esc(r.phone)}</small><div class="req-meta"><span class="chip">${esc(r.proc)}</span><span class="chip">${esc(r.doc)}</span></div></div></div>
        <div><span class="pill bad">● Rejected</span><small style="display:block;color:var(--muted);margin-top:4px">Doctor on leave / Slot full</small></div>
        <div style="display:flex;gap:6px"><a class="btn wa sm" target="_blank" href="https://wa.me/${r.phone.replace(/\D/g,'')}?text=${waMsg}">💬 Offer other time</a><button class="btn sm" onclick="updateApptStatus(${r.rid}, 'pending')">Move back</button></div>
      </div>`;
    }).join('') : '<div class="empty">No rejected requests.</div>';
  }

  return `<div class="page-head"><div><h1>Requests</h1><p>Online bookings from the website. Accepted ones move straight to Today's Patients.</p></div></div>
    <div class="tabs">
      <button class="${state.tab==='pending'?'on':''}" onclick="state.tab='pending';render()">Pending <span class="n">${pList.length}</span></button>
      <button class="${state.tab==='accepted'?'on':''}" onclick="state.tab='accepted';render()">Accepted <span class="n">${aList.length}</span></button>
      <button class="${state.tab==='rejected'?'on':''}" onclick="state.tab='rejected';render()">Rejected <span class="n">${rList.length}</span></button>
    </div>
    <div class="card">${body}</div>`;
}

function viewToday() {
  const rows = state.appts.map(a => `<tr><td><b>${t12(String(a.time||'').padStart(2,'0').slice(0,5))}</b></td><td class="id">#${a.patient_id}</td><td><b>${esc(a.patient_name)}</b><small style="display:block;color:var(--muted)">${esc(a.patient_phone)}</small></td><td>${esc(a.treatment||'Consultation')}</td><td>${stPill(a.status)}</td></tr>`).join('');
  return `<div class="page-head"><h1>Today's Patients</h1></div><div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Time</th><th>ID</th><th>Patient</th><th>Treatment</th><th>Status</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="empty">No queue today</td></tr>'}</tbody></table></div></div>`;
}

function viewManual() {
  return `<div class="page-head"><h1>Manual Patient</h1></div><div class="card" style="max-width:560px"><form onsubmit="handleManualBooking(event)" style="display:flex;flex-direction:column;gap:12px"><div class="field"><label>Patient Name</label><input class="inp" id="mName" required></div><div class="field"><label>Phone Number</label><input class="inp" id="mPhone" required></div><div class="field"><label>Doctor</label><select class="inp" id="mDoc">${DOCTORS.map(d => `<option>${d}</option>`).join('')}</select></div><div class="field"><label>Treatment</label><select class="inp" id="mProc">${Object.keys(PROCS).map(p => `<option>${p}</option>`).join('')}</select></div><div class="field"><label>Time Slot</label><select class="inp" id="mTime">${SLOTS.map(s => `<option value="${s}">${t12(s)}</option>`).join('')}</select></div><button class="btn pri" type="submit">Book Walk-in Patient</button></form></div>`;
}

async function handleManualBooking(e) {
  e.preventDefault();
  const name = $('#mName').value.trim(), phone = $('#mPhone').value.trim(), doc = $('#mDoc').value, proc = $('#mProc').value, time = $('#mTime').value;
  try {
    const res = await fetch('/api/book', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone, countryCode: '+92', doctor_id: DOCTORS.indexOf(doc) + 1, date: new Date().toISOString().split('T')[0], time: parseInt(time), treatment: proc })
    });
    if(res.ok) { toast('Walk-in patient added!'); loadData(); state.page = 'today'; render(); }
  } catch(err) { toast('Error adding patient'); }
}

function viewHistory() {
  const list = state.patients.map(p => `<div style="padding:10px;border-bottom:1px solid var(--line)"><b>${esc(p.name)}</b><small style="display:block;color:var(--muted)">${esc(p.phone)}</small></div>`).join('') || '<div class="empty">No records</div>';
  return `<div class="page-head"><h1>Patient History</h1></div><div class="card">${list}</div>`;
}

function viewSecurity() {
  return `<div class="page-head"><h1>Security</h1></div><div class="card"><p class="muted">Security settings & role matrix active.</p></div>`;
}

async function updateApptStatus(id, status) {
  try {
    const res = await fetch('/api/admin/appointments', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, status })
    });
    if(res.ok) { toast('Status updated to ' + status); loadData(); }
  } catch(e) { toast('Connection error'); }
}

function renderNav() {
  const pend = state.requests.filter(r => r.status === 'pending' || r.status === 'pending_confirmation').length;
  $('#nav').innerHTML = PAGES.map(p => `<button type="button" class="${state.page === p[0] ? 'on' : ''}" onclick="state.page='${p[0]}';render()">${p[1]}${p[0] === 'requests' && pend ? `<span class="badge num">${pend}</span>` : ''}</button>`).join('');
}

function render() {
  const fn = { dashboard: viewDashboard, requests: viewRequests, today: viewToday, manual: viewManual, history: viewHistory, security: viewSecurity }[state.page];
  $('#view').innerHTML = fn ? fn() : '';
  renderNav();
}

$('#themeBtn').addEventListener('click', () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
});

checkSession();
</script>
</body>
</html>
