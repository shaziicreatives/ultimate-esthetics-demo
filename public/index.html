<!doctype html>
<html lang="en">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ultimate Esthetics Clinic Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
:root{
  --bg:#FBF9F5; --surface:#FFFFFF; --surface2:#F5F0E8; --ink:#2C2621; --muted:#6B5E53; --line:#E8DFD1;
  --accent:#4A3F35; --accent-ink:#FBF9F5; --sand:#D4C4B0; --sand-soft:#EFE8DC;
  --wa:#1FA855; --wa-ink:#FFFFFF;
  --ok:#3F7D58; --ok-bg:#E6F1EA; --warn:#9A6414; --warn-bg:#F8EBD2; --bad:#B4443A; --bad-bg:#F6E1DE; --info:#4A6B8A; --info-bg:#E3EBF2;
  --shadow:0 1px 2px rgba(44,38,33,.05),0 8px 24px rgba(44,38,33,.06);
  --font-display:'Instrument Serif',Georgia,serif; --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16120F; --surface:#221D19; --surface2:#2B251F; --ink:#F1EAE0; --muted:#B5A797; --line:#3A322B;
  --accent:#E8DFD1; --accent-ink:#241E19; --sand:#6B5A48; --sand-soft:#2F2822;
  --wa:#2FBF71; --wa-ink:#0E1A13;
  --ok:#7CC49A; --ok-bg:#1F3328; --warn:#E3B568; --warn-bg:#3A2D17; --bad:#E58B80; --bad-bg:#3C201C; --info:#8FB3D4; --info-bg:#1E2C3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16120F; --surface:#221D19; --surface2:#2B251F; --ink:#F1EAE0; --muted:#B5A797; --line:#3A322B;
  --accent:#E8DFD1; --accent-ink:#241E19; --sand:#6B5A48; --sand-soft:#2F2822;
  --wa:#2FBF71; --wa-ink:#0E1A13;
  --ok:#7CC49A; --ok-bg:#1F3328; --warn:#E3B568; --warn-bg:#3A2D17; --bad:#E58B80; --bad-bg:#3C201C; --info:#8FB3D4; --info-bg:#1E2C3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

.app{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;
  display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100dvh - 32px);max-width:1480px;margin:0 auto}
.side{background:var(--surface2);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;
  position:sticky;top:0;height:calc(100dvh - 34px);align-self:start}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:22px}
.brand b{display:block;font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.1}
.brand span{font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sand-soft);color:var(--ink)}
.nav button.on{background:var(--accent);color:var(--accent-ink)}
.nav .badge{margin-left:auto;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--bad);color:#fff}
.nav-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 12px;margin-bottom:-6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.user{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--sand-soft);border:1px solid var(--sand);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.user small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.user b{font-size:13.5px}
.foot-row{display:flex;gap:8px}

.main{padding:28px 30px 36px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-family:var(--font-display);font-weight:400;font-size:38px;line-height:1.05;text-wrap:balance}
.page-head p{color:var(--muted);margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--sand);background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{opacity:.92}
.btn.wa{background:var(--wa);color:var(--wa-ink);border-color:var(--wa)}
.btn.wa:hover{opacity:.92}
.btn.bad{color:var(--bad);border-color:var(--bad-bg);background:var(--bad-bg)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0;margin-bottom:20px}
.card.tint{background:var(--surface2)}
.card h2{font-size:16px;font-weight:700}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-head small,.muted{color:var(--muted)}
.card-head small{font-size:13px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.stat .lbl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.stat .val{font-family:var(--font-display);font-size:34px;line-height:1}
.stat .sub{font-size:12.5px;color:var(--muted)}
.stat.hero{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stat.hero .lbl,.stat.hero .sub{color:inherit;opacity:.78}

.dash{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}

.tbl-wrap{overflow-x:auto;margin:0 -6px;padding:0 6px}
.tbl{width:100%;border-collapse:collapse;min-width:560px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--surface2)}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;line-height:1.2}
.who small{color:var(--muted);font-size:12.5px}
.id{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
:root[data-theme="dark"] .id{color:var(--sand)}
.right{text-align:right}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:var(--sand-soft);color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:8px;background:var(--sand-soft);color:var(--muted)}

.tabs{display:inline-flex;gap:4px;background:var(--surface2);border:1px solid var(--line);padding:4px;border-radius:14px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:0;background:transparent;padding:8px 15px;border-radius:10px;font-weight:600;color:var(--muted);font-size:14px}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.tabs .n{font-size:12px;opacity:.8;margin-left:6px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
.inp:hover{border-color:var(--sand)}
textarea.inp{resize:vertical;min-height:84px}
.inp.ro{background:var(--surface2);color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hint{font-size:12.5px;color:var(--muted)}
.hint.bad{color:var(--bad)} .hint.ok{color:var(--ok)}

.req{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.req .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.list-row .grow b{display:block;line-height:1.25}
.list-row small{color:var(--muted);font-size:12.5px}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}

.bal{font-weight:700;font-variant-numeric:tabular-nums}
.bal.due{color:var(--bad)} .bal.clear{color:var(--ok)}

.hist{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.plist{display:flex;flex-direction:column;gap:2px;max-height:560px;overflow-y:auto;margin:0 -8px;padding:0 8px}
.pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:10px;border-radius:12px}
.pitem:hover{background:var(--surface2)}
.pitem.on{background:var(--surface2);border-color:var(--sand)}
.pitem small{color:var(--muted);font-size:12.5px;display:block;line-height:1.2}
.pitem b{line-height:1.2;display:block}
.timeline{display:flex;flex-direction:column;gap:0;margin-top:6px}
.tl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .d{font-weight:700;font-size:13px}
.tl .d small{display:block;color:var(--muted);font-weight:500}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:16px 0}
.mini div{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mini small{display:block;color:var(--muted);font-size:12px}
.mini b{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.2}

.bigid{font-family:var(--font-display);font-size:68px;line-height:1;color:var(--accent)}
:root[data-theme="dark"] .bigid{color:var(--sand)}
.rules{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{display:flex;gap:10px;color:var(--muted);font-size:13.5px}
.rules .ico{color:var(--ok);margin-top:2px}

.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.meter{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--bad);transition:.2s}

.log{display:flex;flex-direction:column}
.log div{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.log div:last-child{border-bottom:0}
.log time{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.alert{display:flex;gap:10px;padding:11px 12px;border-radius:12px;font-size:13.5px;line-height:1.35;margin-bottom:10px}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.info{background:var(--info-bg);color:var(--info)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert .ico{margin-top:1px}
.stack{display:flex;flex-direction:column;gap:10px}

.scrim{position:fixed;inset:0;background:rgba(20,14,10,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.18);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer-head h2{font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.1}
.drawer-body{padding:18px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.drawer-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 120px 36px;gap:8px;margin-bottom:8px}
.sum{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.sum .r{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sum .r.big{border-top:1px dashed var(--sand);padding-top:10px;font-weight:700;font-size:17px}
.sum .r .inp{width:150px;text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:12px 18px;border-radius:14px;z-index:60;max-width:min(560px,calc(100% - 32px));box-shadow:var(--shadow);font-weight:500}

@media (max-width:1180px){.dash{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);border-radius:20px}
  .side{position:static;height:auto;flex-direction:column;gap:12px;padding:14px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px}
  .nav button{width:auto;white-space:nowrap;padding:9px 13px}
  .nav-label,.user,.side-foot .hint{display:none}
  .side-foot{margin-top:0}
  .main{padding:20px 16px 28px}
  .page-head h1{font-size:32px}
  .hist,.two{grid-template-columns:minmax(0,1fr)}
  .req{grid-template-columns:minmax(0,1fr)}
  .req .btns{justify-content:flex-start}
}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}.tl{grid-template-columns:minmax(0,1fr);gap:4px}.bigid{font-size:54px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">U</div>
      <div><b>Ultimate Esthetics</b><span>Clinic Desk</span></div>
    </div>
    <div class="nav-label">Daily work</div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <div class="user">
        <div class="avatar">OW</div>
        <div><b>Owner</b><small>Full access</small></div>
      </div>
      <div class="foot-row">
        <button class="btn sm" id="themeBtn" type="button" style="flex:1">Light / Dark</button>
        <button class="btn sm" id="logoutBtn" type="button" style="flex:1">Logout</button>
      </div>
      <p class="hint">Live D1 Database Connected.</p>
    </div>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Check-in form"></aside>
<div class="toast" id="toast" hidden role="status"></div>
<audio id="notificationSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rs = n => 'Rs ' + Math.round(Number(n) || 0).toLocaleString('en-US');
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dayOff = o => { const d = new Date(); d.setDate(d.getDate() + o); return ymd(d); };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const nice = s => { if(!s) return ''; const [y, m, d] = s.split('-').map(Number); return pad(d) + ' ' + MON[m - 1] + ' ' + y; };
const wday = s => { if(!s) return ''; const [y, m, d] = s.split('-').map(Number); return WD[new Date(y, m - 1, d).getDay()]; };
const t12 = t => { if(!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return pad(h) + ':' + pad(m) + ' ' + ap; };
const nowHM = () => pad(new Date().getHours()) + ':' + pad(new Date().getMinutes());
const normPhone = p => String(p).replace(/\D/g, '').slice(-10);
const waLink = (phone, msg) => 'https://wa.me/92' + normPhone(phone) + '?text=' + encodeURIComponent(msg);
const initials = n => n.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();

const ICON = {
  home: '<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  inbox: '<path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1 3h6l1-3h5"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  userplus: '<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/>',
  book: '<path d="M4 4h10a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 20a4 4 0 0 1-4-4"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  wa: '<path d="M3 21l1.6-4.9A8.5 8.5 0 1 1 8 19.5z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .7a4 4 0 0 1-1.7-1.7l.7-1-1-2z"/>',
  check: '<path d="M5 12l5 5 9-10"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2.5.6 4 2.3 4 5"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>', mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  card: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/>', logout: '<path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/>'
};
const ic = (n, cls = '') => '<svg class="ico ' + cls + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICON[n] || '') + '</svg>';

const DOCTORS = ['Dr. Ayesha Malik', 'Dr. Hamza Raza', 'Dr. Sana Iqbal'];
const PROCS = { 'Consultation': 1500, 'Hydrafacial': 8000, 'Chemical Peel': 6500, 'Laser Hair Removal': 12000, 'Hair PRP': 18000, 'Botox': 25000, 'Dermal Filler': 35000 };
const SLOTS = ['11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'];

let state = {
  page: 'dashboard', tab: 'pending', filter: 'all', histSel: null, histQ: '',
  patients: [], appts: [], requests: [], logs: [], form: null,
  rules: { idle: true, lock: true, backup: true, twostep: false }
};

const toastEl = $('#toast'); let toastT;
const toast = m => { toastEl.textContent = m; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, 3600); };
const addLog = (who, a) => state.logs.unshift({ t: nowHM(), who, a });
const stPill = s => ({ confirmed: '<span class="pill info">Awaiting check-in</span>', pending: '<span class="pill warn">Pending</span>', inroom: '<span class="pill warn">In room</span>', done: '<span class="pill ok">Done</span>', rejected: '<span class="pill bad">Rejected</span>', noshow: '<span class="pill bad">No-show</span>' }[s] || '<span class="pill info">' + s + '</span>');
const bal = p => (p.visits || []).reduce((a, v) => a + (v.total - v.received), 0);
let lastCount = -1;

async function loadData() {
  try {
    const res = await fetch('/api/admin/appointments');
    if(res.ok) {
      const data = await res.json();
      const rawAppts = data.appointments || [];
      
      // Play sound if new appointment arrives
      if(lastCount !== -1 && rawAppts.length > lastCount) {
        $('#notificationSound').play().catch(e => console.log(e));
      }
      lastCount = rawAppts.length;

      // Map raw appointments to appts & extract unique patients
      state.appts = rawAppts.map(a => ({
        id: a.id,
        pid: a.patient_id,
        time: (a.time || '11:00').slice(0, 5),
        doc: a.doctor_name,
        proc: a.treatment || 'Consultation',
        status: a.status === 'confirmed' ? 'confirmed' : a.status === 'pending' ? 'confirmed' : a.status,
        paid: 0,
        date: a.date
      }));

      let pMap = {};
      rawAppts.forEach(a => {
        if(!pMap[a.patient_id]) {
          pMap[a.patient_id] = { id: a.patient_id, name: a.patient_name, phone: a.patient_phone, src: 'online', followUp: null, visits: [] };
        }
        if(a.status === 'done') {
          pMap[a.patient_id].visits.push({ date: a.date, procs: [a.treatment || 'Consultation'], notes: 'Completed', total: 5000, received: 5000, doc: a.doctor_name });
        }
      });
      state.patients = Object.values(pMap);
      if(!state.histSel && state.patients.length) state.histSel = state.patients[0].id;

      // Map pending/recent requests
      state.requests = rawAppts.filter(a => a.status === 'pending').map(a => ({
        rid: a.id, name: a.patient_name, phone: a.patient_phone, doc: a.doctor_name, proc: a.treatment || 'Consultation', time: (a.time||'11:00').slice(0,5), want: (a.time||'11:00').slice(0,5), status: 'pending', pid: a.patient_id
      }));
    }
  } catch(e) { console.error(e); }
  render();
}

const PAGES = [['dashboard', 'Dashboard'], ['requests', 'Requests'], ['today', "Today's Patients"], ['manual', 'Manual Patient'], ['history', 'Patient History'], ['security', 'Security']];
const NAVICO = { dashboard: 'home', requests: 'inbox', today: 'cal', manual: 'userplus', history: 'book', security: 'shield' };

function renderNav() {
  const pend = state.requests.filter(r => r.status === 'pending').length;
  $('#nav').innerHTML = PAGES.map(p => '<button type="button" data-go="' + p[0] + '" class="' + (state.page === p[0] ? 'on' : '') + '">' + ic(NAVICO[p[0]]) + p[1] + (p[0] === 'requests' && pend ? '<span class="badge num">' + pend + '</span>' : '') + '</button>').join('');
}

function head(title, sub, actions) {
  return '<div class="page-head"><div><h1>' + title + '</h1><p>' + sub + '</p></div><div class="actions">' + (actions || '') + '</div></div>';
}

function viewDashboard() {
  const pend = state.requests.filter(r => r.status === 'pending').length;
  const rows = state.appts.slice(0, 6).map(a => {
    const waText = encodeURIComponent(`Hello ${a.patient_name || 'Patient'}, your appointment at Ultimate Esthetics for ${a.proc} on ${a.time} has been ${a.status.toUpperCase()}.`);
    const waLinkUrl = `https://wa.me/${(a.patient_phone||'').replace(/[^0-9]/g,'')}?text=${waText}`;
    return '<tr><td><b>' + t12(a.time) + '</b></td><td><b>' + esc(a.patient_name || 'Patient') + '</b><small style="display:block;color:var(--muted)">#' + a.pid + '</small></td><td>' + esc(a.doc) + '</td><td>' + stPill(a.status) + '</td><td class="right">' + (a.status === 'confirmed' ? '<button class="btn pri sm" onclick="updateApptStatus(' + a.id + ', \'confirmed\')">Confirm</button> <button class="btn bad sm" onclick="updateApptStatus(' + a.id + ', \'rejected\')">Reject</button>' : '<a class="btn wa sm" target="_blank" href="' + waLinkUrl + '">' + ic('wa') + 'WhatsApp</a>') + '</td></tr>';
  }).join('');

  return head('Dashboard', 'Live clinic overview connected to database.', '<button class="btn" data-go="manual">' + ic('userplus') + 'Manual patient</button><button class="btn pri" data-go="requests">' + ic('inbox') + 'Requests' + (pend ? ' (' + pend + ')' : '') + '</button>') +
    '<div class="stats">' +
    '<div class="stat hero"><div class="lbl">' + ic('cal') + 'Total Appointments</div><div class="val num">' + state.appts.length + '</div><div class="sub">Synced in real-time</div></div>' +
    '<div class="stat"><div class="lbl">' + ic('users') + 'Total Patients</div><div class="val num">' + state.patients.length + '</div><div class="sub">Registered in system</div></div>' +
    '<div class="stat"><div class="lbl">' + ic('inbox') + 'Pending Requests</div><div class="val num">' + pend + '</div><div class="sub">Requires approval</div></div></div>' +
    '<div class="card"><div class="card-head"><h2>Recent Appointments & Queue</h2><button class="btn sm" data-go="today">View All</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Time</th><th>Patient</th><th>Doctor</th><th>Status</th><th class="right">Action / WhatsApp</th></tr></thead><tbody>' + (rows || '<tr><td colspan="5" class="empty">No appointments found.</td></tr>') + '</tbody></table></div></div>';
}

function viewRequests() {
  const tabs = [['pending', 'Pending'], ['accepted', 'Accepted'], ['rejected', 'Rejected']];
  const list = state.requests.filter(r => r.status === state.tab);
  const body = list.length ? list.map(r => {
    const waText = encodeURIComponent(`Hello ${r.name}, your appointment request at Ultimate Esthetics for ${r.proc} on ${r.time} has been updated.`);
    const waUrl = `https://wa.me/${r.phone.replace(/[^0-9]/g,'')}?text=${waText}`;
    return '<div class="req"><div class="who"><div class="avatar">' + initials(r.name) + '</div><div><b>' + esc(r.name) + '</b><small>' + esc(r.phone) + ' · ' + esc(r.proc) + '</small><div style="margin-top:4px"><span class="chip">' + esc(r.doc) + '</span> <span class="chip num">' + t12(r.time) + '</span></div></div></div><div>' + stPill(r.status) + '</div><div class="btns">' + (r.status === 'pending' ? '<button class="btn pri sm" onclick="updateApptStatus(' + r.rid + ', \'confirmed\')">' + ic('check') + 'Accept</button><button class="btn bad sm" onclick="updateApptStatus(' + r.rid + ', \'rejected\')">Reject</button>' : '<a class="btn wa sm" target="_blank" href="' + waUrl + '">' + ic('wa') + 'Send WhatsApp</a>') + '</div></div>';
  }).join('') : '<div class="empty">No requests in this tab.</div>';

  return head('Requests', 'Website and client appointment inquiries.', '') +
    '<div class="tabs">' + tabs.map(t => '<button class="' + (state.tab === t[0] ? 'on' : '') + '" onclick="state.tab=\'' + t[0] + '\';render()">' + t[1] + '<span class="n num">' + state.requests.filter(r => r.status === t[0]).length + '</span></button>').join('') + '</div>' +
    '<div class="card">' + body + '</div>';
}

function viewToday() {
  const fl = [['all', 'All'], ['confirmed', 'Confirmed'], ['done', 'Done']];
  const rows = state.appts.map((a, i) => {
    const waText = encodeURIComponent(`Hello ${a.patient_name || 'Patient'}, regarding your visit at Ultimate Esthetics.`);
    const waUrl = `https://wa.me/${(a.patient_phone||'').replace(/[^0-9]/g,'')}?text=${waText}`;
    return '<tr><td><b>' + t12(a.time) + '</b></td><td class="id">#' + a.pid + '</td><td><b>' + esc(a.patient_name || 'Patient') + '</b><small style="display:block;color:var(--muted)">' + esc(a.patient_phone || '') + '</small></td><td>' + esc(a.proc) + '<small style="display:block;color:var(--muted)">' + esc(a.doc) + '</small></td><td>' + stPill(a.status) + '</td><td class="right" style="white-space:nowrap"><button class="btn pri sm" onclick="updateApptStatus(' + a.id + ', \'confirmed\')">Confirm</button> <button class="btn bad sm" onclick="updateApptStatus(' + a.id + ', \'rejected\')">Reject</button> <a class="btn wa sm" target="_blank" href="' + waUrl + '">' + ic('wa') + 'WhatsApp</a></td></tr>';
  }).join('');

  return head("Today's Patients", 'Live schedule and appointment actions.', '') +
    '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Time</th><th>ID</th><th>Patient</th><th>Procedure / Doctor</th><th>Status</th><th class="right">Actions</th></tr></thead><tbody>' + (rows || '<tr><td colspan="6" class="empty">No appointments found.</td></tr>') + '</tbody></table></div></div>';
}

function viewManual() {
  return head('Manual Patient', 'Add walk-in appointments directly.', '') +
    '<div class="card" style="max-width:600px"><form id="manualForm" onsubmit="handleManualBooking(event)" class="stack" style="gap:14px">' +
    '<div class="field"><label>Patient Name</label><input class="inp" id="mName" required placeholder="Full name"></div>' +
    '<div class="field"><label>Phone Number</label><input class="inp" id="mPhone" required placeholder="03000000000"></div>' +
    '<div class="grid2"><div class="field"><label>Doctor</label><select class="inp" id="mDoc">' + DOCTORS.map(d => '<option>' + d + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>Treatment</label><select class="inp" id="mProc">' + Object.keys(PROCS).map(p => '<option>' + p + '</option>').join('') + '</select></div></div>' +
    '<div class="field"><label>Time Slot</label><select class="inp" id="mTime">' + SLOTS.map(s => '<option value="' + s + '">' + t12(s) + '</option>').join('') + '</select></div>' +
    '<button class="btn pri" type="submit">' + ic('plus') + 'Book Walk-in Appointment</button></form></div>';
}

async function handleManualBooking(e) {
  e.preventDefault();
  const name = $('#mName').value.trim();
  const phone = $('#mPhone').value.trim();
  const doc = $('#mDoc').value;
  const proc = $('#mProc').value;
  const time = $('#mTime').value;

  try {
    const res = await fetch('/api/book', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone, countryCode: '+92', doctor_id: DOCTORS.indexOf(doc) + 1, date: ymd(new Date()), time: parseInt(time), treatment: proc })
    });
    if(res.ok) {
      toast('Walk-in appointment added successfully!');
      loadData();
      state.page = 'today';
      render();
    } else {
      const d = await res.json();
      toast(d.error || 'Failed to add appointment');
    }
  } catch(err) { toast('Connection error'); }
}

function viewHistory() {
  const p = state.patients.find(x => x.id === state.histSel) || state.patients[0];
  const list = state.patients.map(x => '<button class="pitem' + (x.id === state.histSel ? ' on' : '') + '" onclick="state.histSel=' + x.id + ';render()"><b>' + esc(x.name) + '</b><small>' + esc(x.phone) + '</small></button>').join('') || '<div class="empty">No patients found.</div>';
  const detail = p ? '<div class="card"><h2>' + esc(p.name) + '</h2><p class="muted">' + esc(p.phone) + ' · ID #' + p.id + '</p><div class="mini"><div><small>Total Visits</small><b>' + (p.visits.length || 1) + '</b></div><div><small>Status</small><b>Active</b></div></div></div>' : '<div class="card">Select a patient.</div>';

  return head('Patient History', 'Review patient records and logs.', '') +
    '<div class="hist"><div class="card"><div class="plist">' + list + '</div></div><div id="hdetail">' + detail + '</div></div>';
}

function viewSecurity() {
  return head('Security & Settings', 'Manage password and activity logs.', '') +
    '<div class="two"><div class="card"><div class="card-head"><h2>Change Password</h2></div><form onsubmit="event.preventDefault();toast(\'Password updated successfully!\')" class="stack" style="gap:12px"><div class="field"><label>Current Password</label><input class="inp" type="password" required></div><div class="field"><label>New Password</label><input class="inp" type="password" required></div><button class="btn pri" type="submit">Update Password</button></form></div>' +
    '<div class="card"><div class="card-head"><h2>Activity Log</h2></div><div class="log">' + (state.logs.length ? state.logs.map(l => '<div><time>' + l.t + '</time><span><b>' + esc(l.who) + '</b> ' + esc(l.a) + '</span></div>').join('') : '<div class="empty">No activity recorded yet.</div>') + '</div></div></div>';
}

async function updateApptStatus(id, status) {
  try {
    const res = await fetch('/api/admin/appointments', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, status })
    });
    if(res.ok) {
      toast('Appointment status updated to ' + status);
      loadData();
    } else {
      toast('Failed to update status');
    }
  } catch(e) { toast('Connection error'); }
}

function render() {
  const fn = { dashboard: viewDashboard, requests: viewRequests, today: viewToday, manual: viewManual, history: viewHistory, security: viewSecurity }[state.page];
  $('#view').innerHTML = fn ? fn() : '';
  renderNav();
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if(g) { state.page = g.dataset.go; render(); window.scrollTo(0, 0); }
});

$('#themeBtn').addEventListener('click', () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
});
$('#logoutBtn').addEventListener('click', () => { location.reload(); });

loadData();
setInterval(loadData, 10000); // Live poll database every 10 seconds with sound notification
</script>
</body>
